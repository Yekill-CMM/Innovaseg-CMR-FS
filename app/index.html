<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--surface-2:#E9EDF2;--ink:#15202B;--ink-2:#4A5866;--ink-3:#7B8794;--line:#D9DFE6;
  --brand:#14406B;--brand-ink:#FFFFFF;--brand-soft:#E1EAF3;--head:#0D2A46;
  --ok:#2A7A56;--ok-soft:#E0F0E8;--warn:#A86F12;--warn-soft:#FAEFD9;--bad:#B5352B;--bad-soft:#F7E2DF;--info:#2F6690;--info-soft:#E2EDF6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C;--surface:#16202A;--surface-2:#1D2935;--ink:#E5EBF0;--ink-2:#A9B5C1;--ink-3:#7E8B98;--line:#2A3745;
    --brand:#79A9D9;--brand-ink:#0E151C;--brand-soft:#1C3148;--head:#0A1A29;
    --ok:#62C193;--ok-soft:#173327;--warn:#E2B25A;--warn-soft:#382C16;--bad:#E8766B;--bad-soft:#3A1E1B;--info:#86B8E0;--info-soft:#1A2E40;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C;--surface:#16202A;--surface-2:#1D2935;--ink:#E5EBF0;--ink-2:#A9B5C1;--ink-3:#7E8B98;--line:#2A3745;
  --brand:#79A9D9;--brand-ink:#0E151C;--brand-soft:#1C3148;--head:#0A1A29;
  --ok:#62C193;--ok-soft:#173327;--warn:#E2B25A;--warn-soft:#382C16;--bad:#E8766B;--bad-soft:#3A1E1B;--info:#86B8E0;--info-soft:#1A2E40;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Archivo','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100%}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--head);color:#fff;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:7px;background:#fff;color:#0D2A46;display:grid;place-items:center;font-weight:800;font-stretch:115%;font-size:13px}
.brand b{font-weight:700}
.brand .rev{font-size:11px;font-weight:500;opacity:.65;margin-left:2px}
.search{position:relative;flex:1;max-width:520px;margin-left:12px}
.search input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px 12px;color:#fff}
.search input::placeholder{color:rgba(255,255,255,.6)}
.search input:focus{outline:2px solid #fff;outline-offset:1px}
.gresults{position:absolute;top:42px;left:0;right:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:60vh;overflow:auto;padding:6px}
.gresults .gr{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}
.gresults .gr:hover,.gresults .gr:focus{background:var(--surface-2)}
.user-sel{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 8px;max-width:230px}
.user-sel option{color:#15202B}
button.user-sel{cursor:pointer;font:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add-btn{margin-left:auto;white-space:nowrap}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
nav.side a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
nav.side a:hover{background:var(--surface-2);color:var(--ink)}
nav.side a.active{background:var(--brand-soft);color:var(--brand);font-weight:700}
nav.side .sep{height:1px;background:var(--line);margin:8px 6px}
nav.side .foot{margin-top:auto;padding:12px;font-size:12px;color:var(--ink-3)}
.cnt{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--surface-2);color:var(--ink-2)}
.cnt.bad{background:var(--bad-soft);color:var(--bad)}
main{overflow:auto;padding:22px 26px 40px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:26px;font-stretch:112%;font-weight:750;margin:0;letter-spacing:-.01em}
h2{font-size:15px;font-weight:700;margin:0}
h3{font-size:13.5px;font-weight:700;margin:18px 0 8px}
.sub{color:var(--ink-2);margin:2px 0 0}
.muted{color:var(--ink-3)}
.sm{font-size:12.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-b{padding:6px}
.empty{padding:18px 12px;color:var(--ink-3);text-align:center}
/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-size:27px;font-weight:750;font-stretch:118%;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.kpi .v.bad{color:var(--bad)}
.kpi .v.warn{color:var(--warn)}
.kpi .h{font-size:12px;color:var(--ink-3);margin-top:2px}
.meter{height:6px;background:var(--surface-2);border-radius:99px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px}
.grid2p{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
/* row items */
.row-item{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--ink)}
.row-item:hover{background:var(--surface-2)}
.row-item .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--ink-3)}
.sev-bad .dot{background:var(--bad)}.sev-warn .dot{background:var(--warn)}.sev-info .dot{background:var(--info)}.sev-ok .dot{background:var(--ok)}
.ri-main{display:flex;flex-direction:column;min-width:0;flex:1}
.ri-main>span{overflow:hidden;text-overflow:ellipsis}
.ri-right{text-align:right;white-space:nowrap;font-size:12.5px}
.chk{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--brand)}
/* badges */
.b{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--info-soft);color:var(--info)}.b-brand{background:var(--brand-soft);color:var(--brand)}
.grade{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-weight:800;font-size:12.5px}
.grade.A{background:var(--ok-soft);color:var(--ok)}.grade.B{background:var(--warn-soft);color:var(--warn)}.grade.C{background:var(--surface-2);color:var(--ink-2)}
/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:720px}
.tbl th{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.num,.tbl th.num{text-align:right;white-space:nowrap}
/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar select,.toolbar input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.chip b{color:var(--ink);margin-left:4px}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
header .btn.pri{background:#fff;color:#0D2A46;border-color:#fff}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:12.5px}
.icon-btn{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;padding:4px 6px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(252px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{background:var(--surface-2);border-radius:12px;padding:10px;min-height:340px;scroll-snap-align:start;border:2px solid transparent}
.col.over{border-color:var(--brand)}
.kanban.leads{grid-auto-columns:minmax(212px,1fr)}
.lead-exits{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.lead-exits .col{min-height:0;background:transparent;border:2px dashed var(--line)}
.lead-exits .col.over{border-color:var(--brand);border-style:solid}
.lead-exits a{display:block;font-size:12.5px;padding:3px 0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px}
.kv>div{display:flex;flex-direction:column;gap:2px}.kv .full{grid-column:1/-1}
.kanban-fases{grid-template-rows:auto 1fr}
.kanban-fases .col{grid-row:2}
.fase{grid-row:1;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);padding:6px 10px;border-radius:8px;background:var(--surface-2)}
.fase-p{border-left:3px solid var(--ink-3)}
.fase-o{border-left:3px solid var(--brand)}
.col-p{background:transparent;border:2px dashed var(--line)}
.col-h{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 10px}
.col-h h2{font-size:13.5px}
.col-h .muted{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:8px;cursor:grab;display:block;width:100%;text-align:left;color:var(--ink)}
.card:hover{border-color:var(--ink-3)}
.card.flag{border-left:3px solid var(--bad)}
/* Booking según lo facturado: 100 % en verde, sin facturar o a medias en rojo; ambos muy tenues */
.card.inv-ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.card.inv-pend{background:var(--bad-soft);border-left:4px solid var(--bad)}
.tbl tr.inv-ok td{background:var(--ok-soft)}
.tbl tr.tot td{background:var(--surface-2)}
.tbl tr.inv-pend td{background:var(--bad-soft)}
.tbl tr.inv-ok td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
.tbl tr.inv-pend td:first-child{box-shadow:inset 4px 0 0 var(--bad)}

.card .c-co{font-size:12px;color:var(--ink-2)}
.card .c-name{font-weight:650;margin:2px 0 6px;line-height:1.3}
.card .c-row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2)}
.card .c-amt{font-weight:750;color:var(--ink);font-stretch:110%}
.card .c-next{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-2)}
.card .c-next.bad{color:var(--bad)}
.card.dragging{opacity:.5}
/* layers */
.overlay{position:fixed;inset:0;background:rgba(8,18,28,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(660px,100%);background:var(--bg);z-index:21;overflow:auto;box-shadow:-12px 0 40px rgba(0,0,0,.2);padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(30px + env(safe-area-inset-bottom,0px))}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border-radius:14px;z-index:31;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(880px,calc(100% - 24px))}
#modalLayer .overlay{z-index:30}
.d-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.d-head h1{font-size:21px}
.d-actions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.warnbox{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px}
.warnbox.bad{background:var(--bad-soft);color:var(--bad)}
.warnbox.warn{background:var(--warn-soft);color:var(--warn)}
.warnbox.info{background:var(--info-soft);color:var(--info)}
.section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.section>h2{margin-bottom:10px}
/* forms */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fgrid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:500}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;color:var(--ink);font-size:14px;min-width:0}
label.f textarea{min-height:64px;resize:vertical}
label.f .hint{font-size:11.5px;color:var(--ink-3);font-weight:400}
fieldset{border:0;padding:0;margin:0;min-width:0}
.err{color:var(--bad);font-size:13px;margin:8px 0 0;min-height:0}
.err:empty{display:none}
.form-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.tcv{background:var(--brand-soft);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcv strong{font-size:20px;font-stretch:115%;color:var(--brand)}
/* score */
.score{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.score .big{font-size:34px;font-weight:800;font-stretch:118%;line-height:1}
.score-parts{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:12.5px}
.score-parts .p{text-align:right;font-weight:700}
.score-parts .z{color:var(--ink-3);font-weight:400}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:6px}
.tl li:last-child{border-left-color:transparent}
.tl li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.tl li.future::before{border-color:var(--warn)}
.tl .t-h{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2)}
.tl .t-d{margin-top:2px}
.tl .t-r{font-size:12.5px;color:var(--ink-2);margin-top:2px}
/* bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;font-size:12.5px}
.bar-row .track{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar-row .track i{display:block;height:100%;background:var(--brand);border-radius:4px}
.bar-row .track i.alt{background:var(--bad)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0}
/* resultados por período */
.cols{display:flex;gap:8px;height:230px;overflow-x:auto;padding:12px 14px 10px}
.colb{flex:1 0 54px;display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);border-radius:8px}
.colb .rate{font-size:11.5px;font-weight:700;color:var(--ink-3);text-align:center}
.colb .area{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-bottom:1px solid var(--line)}
.colb .amt{font-size:11px;color:var(--ink-3);white-space:nowrap;margin-bottom:3px}
.colb .bar{display:block;width:62%;max-width:46px;min-height:2px;background:var(--brand-soft);border-radius:5px 5px 0 0;transition:background .15s}
.colb:hover .bar{background:color-mix(in srgb,var(--brand) 40%,var(--brand-soft))}
.colb.on .bar{background:var(--brand)}
.colb.on .amt,.colb.on .per,.colb.on .rate{color:var(--ink);font-weight:700}
.colb .per{font-size:12px;color:var(--ink-3);text-align:center;white-space:nowrap}
.var{font-weight:700;color:var(--ink-3)}.var.up{color:var(--ok)}.var.down{color:var(--bad)}
.tbl tr.sel td{background:var(--brand-soft)}
nav.side .foot.sync{display:flex;gap:8px;align-items:flex-start;line-height:1.4}
nav.side .foot.sync::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:4px;background:var(--ink-3)}
nav.side .foot.sync[data-state="ok"]::before{background:var(--ok)}
nav.side .foot.sync[data-state="guardando"]::before,nav.side .foot.sync[data-state="conectando"]::before,nav.side .foot.sync[data-state="navegador"]::before{background:var(--warn)}
nav.side .foot.sync[data-state="error"]::before{background:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:#fff;padding:11px 16px;border-radius:10px;z-index:50;max-width:min(560px,calc(100% - 24px));box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13.5px}
nav.bottom{display:none}
.only-m{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{position:fixed;top:0;left:0;bottom:0;width:260px;z-index:40;transform:translateX(-105%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  nav.side.open{transform:none;box-shadow:10px 0 40px rgba(0,0,0,.3)}
  .only-m{display:inline-block}
  .add-btn,.user-sel{display:none}
  .brand span:last-child{display:none}
  .search{margin-left:4px}
  main{padding:16px 14px 96px}
  .grid2p{grid-template-columns:minmax(0,1fr)}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .kpi{border-bottom:1px solid var(--line)}
  .kpi .v{font-size:23px}
  .bar-row{grid-template-columns:100px 1fr 80px}
  nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:15;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  nav.bottom a,nav.bottom button{background:none;border:0;text-align:center;font-size:11.5px;color:var(--ink-2);text-decoration:none;padding:6px 2px;border-radius:8px;cursor:pointer}
  nav.bottom a.active{color:var(--brand);font-weight:700}
  nav.bottom .plus{background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:13px}
  .mobile-user{display:block!important}
}
.mobile-user{display:none;padding:10px 12px}
.mobile-user select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- Aviso de conexión ---------- */

<script>
/* ============ CONSTANTES ============ */
const STAGES=[
 {id:'identificada',name:'Identificada',p:10},{id:'calificada',name:'Calificada',p:20},{id:'levantamiento',name:'Levantamiento',p:30},
 {id:'ingenieria',name:'En Desarrollo',p:40},{id:'oferta',name:'Pipeline',p:50},{id:'seguimiento',name:'Upside',p:60},
 {id:'negociacion',name:'Forecast',p:80},{id:'adjudicada',name:'Booking',p:100}];
// Fases del Kanban: las 3 primeras etapas son de prospección; las demás son las del funnel de First Security
const PROSP_STAGES=['identificada','calificada','levantamiento'];
// Política comercial (nov 2026): una oportunidad es una oferta con código CM. Sus etapas son 4 y cada una tiene un significado fijo.
// 'ingenieria' (En Desarrollo) ya no se usa: las oportunidades que estaban ahí pasan a Pipeline (migrate, versión 3).
const STAGE_DESC={oferta:'Oferta en desarrollo',seguimiento:'Oferta entregada',negociacion:'Adjudicada verbalmente',adjudicada:'Cerrada con contrato'};
const LEGACY_STAGES=['ingenieria'];
const CM_RE=/^CM-\d{6}-\d{2}$/;
// Fuente única (nov 2026): las oportunidades vienen SOLO del Excel semanal de Gerencia (Importar funnel), hasta que exista un
// conector para escribir en esa base. El CRM no crea oportunidades ni cambia su código, nombre, etapa, probabilidad, montos,
// fechas, responsable o estado; solo agrega la gestión (actividades, tareas, reuniones, próxima acción, estrategia, contactos).
// Una oportunidad sin vínculo al Excel (o.fx) es antigua o creada a mano antes de esta regla: no suma al pipeline y queda
// «pendiente del Excel» hasta que el archivo la traiga con su código CM.
const enExcel=o=>!!o.fx;
// CRM FS (nov 2026): las oportunidades se crean y gestionan solo en el CRM, con código OP-AAMMDD-NN que asigna el servidor
// (guardado.php) y la marca crm. No entra nada por Excel: la importación del funnel no tiene entrada en la pantalla y el
// funnel solo se exporta. Lo de o.fx queda para leer datos antiguos.
const enFunnel=o=>!!o.fx||!!o.crm;
const oppCRM=o=>!!o&&!o.fx&&!!o.crm;
// Código provisional (el definitivo lo pone el servidor al guardar: este navegador no ve las oportunidades de todos)
function provisionalOP(){const k=todayIso.slice(2,4)+todayIso.slice(5,7)+todayIso.slice(8,10);const used=new Set(S.opps.map(o=>String(o.code||'').toUpperCase()));
 const u=String((S.seq||{}).opUlt||'');let n=u.startsWith('OP-'+k+'-')?Number(u.slice(10))||0:0;let c;do{n++;c=`OP-${k}-${String(n).padStart(2,'0')}`}while(used.has(c));return c}
// Tipos de negocio del Excel y sus plazos. Cada tipo puede tener plazos propios (Configuración); lo que no se defina toma
// los generales. Se iteran en conjunto: no todos los proyectos tienen el mismo plazo de consulta y respuesta.
const TIPOS_NEGOCIO=[['Seg. Física','Seguridad Física'],['Seg. Electrónica','Seguridad Electrónica'],['Seg. Integral','Seguridad Integral'],['One Shot','One Shot']];
// Tipo de negocio: lo elige quien crea la oportunidad en el CRM (o.tipo); las antiguas lo traían del Excel (o.fx.tipo)
const tipoDe=o=>o?(o.tipo||(o.fx&&o.fx.tipo)||''):'';
const tipoLabel=o=>{const t=tipoDe(o);const x=TIPOS_NEGOCIO.find(([k])=>k===t);return x?x[1]:(t||'Sin tipo')};
function plazo(o){const R=S.config,t=(R.plazos||{})[tipoDe(o)]||{};const v=(k,d)=>Number(t[k])>0?Number(t[k]):d;
 return{warn:v('warn',R.oppNoAct.warn),risk:v('risk',R.oppNoAct.risk),remind:v('remind',R.followup.remind),yellow:v('yellow',R.followup.yellow),red:v('red',R.followup.red),stalled:v('stalled',R.stalledDays)}}
// En una oportunidad solo se mira el estatus (Excel) y se gestionan tareas: su «próxima acción» es su próxima tarea pendiente.
// Días sin gestión: desde la última gestión real (actividad, tarea completada o «última conversación» del Excel);
// si nunca hubo, desde la entrega de la oferta o la fecha de contacto del Excel.
// Días desde la última gestión real con un cliente: actividades (de sus prospectos, oportunidades o la empresa),
// tareas completadas y «última conversación» del Excel. Sin ninguna, desde la fecha más antigua de sus registros abiertos.
function clientIdle(cid){let m=null;const up=x=>{if(x&&x<=todayIso&&(!m||x>m))m=x};
 for(const a of S.activities)if(a.companyId===cid&&!isSysAct(a))up(a.date);
 const ids=new Set(S.opps.filter(o=>o.companyId===cid).map(o=>o.id).concat(S.leads.filter(l=>l.companyId===cid).map(l=>l.id)));
 for(const t of S.tasks)if(ids.has(t.entityId)&&t.status==='Completada')up(t.completedAt);
 for(const o of S.opps)if(o.companyId===cid&&o.fx)up(o.fx.ult);
 if(!m){const f=S.opps.filter(o=>o.companyId===cid&&o.status==='abierta').map(o=>(o.fx&&o.fx.pres)||o.createdAt).concat(S.leads.filter(l=>l.companyId===cid&&LEAD_ACTIVE.includes(l.stage)).map(l=>l.createdAt)).filter(Boolean).sort();m=f[0]||null}
 return m?daysFrom(m):null}
const idleDays=o=>daysFrom(lastActOpp(o)||(o.fx&&o.fx.pres)||o.createdAt)||0;
/* ============ AUTOMATIZACIONES ============
   Para que ninguna oportunidad quede sin gestión, el CRM crea tareas solo (marcadas «Automática» y en la auditoría).
   Corre al abrir el CRM, al importar y después de cada cambio; no duplica: una regla no crea otra tarea mientras la
   anterior siga abierta, y las de cambio de etapa se crean una sola vez por oportunidad. Se activan en Configuración.
   1. Sin gestión: N días (umbral «sin actividad: alerta») → «Contactar al cliente», prioridad Alta, para hoy.
   2. Oferta entregada (Upside): plazo de recordatorio sin gestión → «Seguimiento de la oferta entregada», Alta, hoy.
   3. Sin tarea pendiente → «Definir la próxima gestión», para el día hábil siguiente.
   4. El Excel la pasa a Forecast → «Confirmar adjudicación y pedir contrato u OC»; a Booking → «Traspaso a operaciones». */
function autoTask(o,rule,title,due,prio,once){const key=rule+':'+o.id;
 if(S.tasks.some(t=>t.auto===key&&(once||isOpenTask(t))))return 0;
 S.tasks.push({id:uid('t'),title,entityType:'opp',entityId:o.id,assigneeId:o.ownerId||S.currentUser,priority:prio,due,status:'Pendiente',createdAt:todayIso,by:'Automática',auto:key});
 audit(o.code,'Tarea automática','',title);return 1}
function runAutomations(){if(STORE.mode==='conectando'&&STORE.fromLocal)return 0;if(S.mode==='real'&&promoteTargets())save();if(window.__migrado&&S.mode==='real'){window.__migrado=false;save()}const A=S.config.auto||{};if(!A.on||S.mode!=='real')return 0;let n=0;const R=S.config;
 for(const o of S.opps){if(!enFunnel(o))continue;
  if(o.status==='ganada'&&A.stage&&((o.bookedAt||'')>=addDays(-30)||(o.wonAt||'')>=addDays(-30)))n+=autoTask(o,'booking',`Traspaso a operaciones e inicio del servicio (${o.code})`,workday(addDays(1)),'Alta',true);
  if(o.status!=='abierta')continue;
  const d=idleDays(o),f=oppFollow(o);
  if(A.idle&&d>=plazo(o).warn)n+=autoTask(o,'sin-gestion',`Contactar al cliente: ${d} días sin gestión (${o.code})`,todayIso,'Alta');
  else if(A.follow&&f&&f.sev!=='ok')n+=autoTask(o,'seguimiento',`Seguimiento de la oferta entregada (${o.code})`,todayIso,'Alta');
  if(A.stage&&o.stage==='negociacion')n+=autoTask(o,'forecast',`Confirmar adjudicación y pedir contrato u OC (${o.code})`,workday(addDays(2)),'Alta',true);
  if(A.noTask&&!oppTasks(o).length)n+=autoTask(o,'sin-tarea',`Definir la próxima gestión (${o.code})`,workday(addDays(1)),'Media');
 }
 if(n)save();return n}
const oppTasks=o=>S.tasks.filter(t=>t.entityType==='opp'&&t.entityId===o.id&&isOpenTask(t)).sort((a,b)=>(a.due||'').localeCompare(b.due||''));
const nextTask=o=>oppTasks(o)[0]||null;
// Código CM-AAMMDD-NN: fecha + correlativo del día. Se sugiere el primero libre; el usuario puede corregirlo.
function nextCM(date){const d=(date||todayIso);const k=d.slice(2,4)+d.slice(5,7)+d.slice(8,10);const used=new Set(S.opps.map(o=>String(o.code||'').toUpperCase()).concat(S.leads.map(l=>String(l.cmCode||'').toUpperCase())));let n=1;while(used.has(`CM-${k}-${String(n).padStart(2,'0')}`))n++;return `CM-${k}-${String(n).padStart(2,'0')}`}
function checkCM(code,selfId){const c=String(code||'').trim().toUpperCase();if(!CM_RE.test(c))return 'El código debe tener el formato CM-AAMMDD-NN, por ejemplo CM-261112-01.';const dup=S.opps.find(o=>String(o.code||'').toUpperCase()===c&&o.id!==selfId);if(dup)return `El código ${c} ya lo usa «${dup.name}» (${cname(dup.companyId)}).`;const res=S.leads.find(l=>String(l.cmCode||'').toUpperCase()===c&&l.id!==selfId);return res?`El código ${c} ya está reservado para ${res.code||'otro prospecto'} (${cname(res.companyId)}).`:''}
// Oportunidades = solo etapas del funnel. La prospección se trabaja en Prospectos y Planes.
const FUNNEL_STAGES=STAGES.filter(s=>!PROSP_STAGES.includes(s.id)&&!LEGACY_STAGES.includes(s.id));
const fueraFunnel=o=>o.status==='abierta'&&PROSP_STAGES.includes(o.stage);
// Estado del funnel → etapa del CRM (las abiertas y Booking van directo a su columna)
const FX_STAGE={'En Desarrollo':'oferta','Pipeline':'oferta','Upside':'seguimiento','Forecast':'negociacion','Booking':'adjudicada'};
// Qué significa cada columna del Kanban de prospección (frase bajo el título)
const LEAD_STAGE_DESC={'Identificado':'Hay una señal y una persona a quien llamar.','Investigación':'Entender la operación antes del primer contacto.',
 'Contacto inicial':'Primer intento enviado, esperando respuesta.','Contactado':'Hay conversación; falta conseguir la reunión.',
 'Reunión solicitada':'Reunión en agenda, preparar la conversación.','Reunión realizada':'Escuchamos el problema; definir si hay negocio.',
 'Calificación':'Hay necesidad, decisor y plazo: vale la pena invertir tiempo.','Levantamiento':'En terreno, dimensionando la solución.'};
// ---- Avance de etapa: sugerencias desde las actividades y control al calificar ----
const QUAL_PLAZOS=['Menos de 3 meses','3 a 6 meses','6 a 12 meses','Más de 12 meses'];
const QUAL_PRESUP=['Presupuesto aprobado','Contrato actual vence pronto','En preparación de presupuesto','Sin presupuesto aún'];
const SIN_RESP=/sin respuesta|no contest|no respond|no responde|buz[oó]n|rebot|no ubicad|no disponible/i;
// Etapa que sugieren las actividades del prospecto (solo hacia adelante y sin pasar por encima de Calificación sin el control)
function leadSuggestion(l){if(!l||!LEAD_ACTIVE.includes(l.stage))return null;const rk=x=>LEAD_ACTIVE.indexOf(x);const acts=S.activities.filter(a=>a.entityType==='lead'&&a.entityId===l.id);
 const out=[['Llamada','Email','WhatsApp']];let best=null;const sug=(st,why)=>{if(rk(st)>rk(l.stage)&&(!best||rk(st)>rk(best.st)))best={st,why}};
 for(const a of acts){const t=a.type;const futura=a.date>todayIso;
  if(out[0].includes(t)&&!futura){sug('Contacto inicial',`registraste ${t.toLowerCase()} el ${fmtDate(a.date)}`);if((a.result||'').trim()&&!SIN_RESP.test(a.result))sug('Contactado',`respondió (${t.toLowerCase()} del ${fmtDate(a.date)})`)}
  if(MEETING_TYPES.includes(t)&&t!=='Visita a terreno'){if(futura)sug('Reunión solicitada',`${t.toLowerCase()} agendada para el ${fmtDate(a.date)}`);else sug('Reunión realizada',`${t.toLowerCase()} del ${fmtDate(a.date)}`)}
  if(t==='Visita a terreno'){if(futura)sug('Reunión solicitada',`visita agendada para el ${fmtDate(a.date)}`);else sug('Levantamiento',`visita a terreno del ${fmtDate(a.date)}`)}}
 if(!best||(l.sugNo||[]).includes(best.st))return null;return best}
const qualCompleta=l=>!!(l.qual&&l.qual.decisorId&&l.qual.plazo&&l.qual.presupuesto);
const cruzaCalif=(from,to)=>LEAD_ACTIVE.indexOf(to)>=LEAD_ACTIVE.indexOf('Calificación')&&LEAD_ACTIVE.indexOf(from)<LEAD_ACTIVE.indexOf('Calificación');
function qualForm(l,to){const ks=S.contacts.filter(k=>k.companyId===l.companyId);const q=l.qual||{};
 return `<h1 style="font-size:20px">Calificar ${esc(l.code||'')} · ${esc(cname(l.companyId))}</h1><p class="sub sm">Para pasar a ${esc(to)}: hay necesidad, alguien que decide, plazo y con qué se paga. Si falta algo puedes avanzar igual; quedará marcado como calificación incompleta.</p>
 <form data-form="qual" data-id="${l.id}" data-to="${esc(to)}" style="margin-top:12px"><div class="fgrid">
  <label class="f full">Quién decide<select name="decisorId">${opt(ks.map(k=>[k.id,contactLabel(k)+(k.decisionRole?' · '+k.decisionRole:'')]),q.decisorId||(ks.find(k=>k.decisionRole==='Decisor')||{}).id||'','Aún no lo sé')}</select><span class="hint">Se marca como «Decisor» en el contacto.</span></label>
  <label class="f">Plazo estimado de decisión<select name="plazo">${opt(QUAL_PLAZOS,q.plazo||'','Aún no lo sé')}</select></label>
  <label class="f">Presupuesto o contrato<select name="presupuesto">${opt(QUAL_PRESUP,q.presupuesto||'','Aún no lo sé')}</select></label>
  <label class="f full">Necesidad confirmada<textarea name="necesidad" placeholder="Qué problema confirmó el cliente">${esc(q.necesidad||l.problem||'')}</textarea></label>
 </div><p class="err" data-err></p><div class="form-foot"><button type="button" class="btn" data-action="closeModal">Cancelar</button><button class="btn pri" type="submit">Guardar y pasar a ${esc(to)}</button></div></form>`}
const LEAD_STAGES=['Identificado','Investigación','Contacto inicial','Contactado','Reunión solicitada','Reunión realizada','Calificación','Levantamiento','Oportunidad creada','No calificado','Nurturing'];
// Prospección: 8 etapas activas (columnas del Kanban) y 3 salidas. Un prospecto tiene código propio PR-AAAA-NNNN,
// distinto del CM de las oportunidades, y puede haber varios abiertos en un mismo cliente (cada uno con su nombre).
const LEAD_ACTIVE=LEAD_STAGES.slice(0,8);
const LEAD_EXITS=['Oportunidad creada','No calificado','Nurturing'];
const LEAD_EXIT_DESC={'Oportunidad creada':'Pasó a oferta (se vincula a su CM del Excel)','No calificado':'Descartado con motivo','Nurturing':'Recontacto programado'};
const INDUSTRIES=['Energía','Minería','Industria','Logística','Centros de distribución','Data Centers','Puertos','Retail','Salud','Educación','Construcción','Inmobiliario','Agroindustria','Smart Cities','Banca / Finanzas','Servicios','Sector público','Otros'];
const STRATEGIC=['Energía','Minería','Puertos','Data Centers'];
const MID_IND=['Industria','Logística','Centros de distribución'];
const REGIONS=['Arica y Parinacota','Tarapacá','Antofagasta','Atacama','Coquimbo','Valparaíso','Metropolitana',"O'Higgins",'Maule','Ñuble','Biobío','La Araucanía','Los Ríos','Los Lagos','Aysén','Magallanes'];
const DECISION_ROLES=['Decisor','Influenciador','Usuario','Comprador','Prescriptor','Técnico','Gerencia','Finanzas','Operaciones','Seguridad','Facility Management','Prevención de Riesgos','TI'];
const ACT_TYPES=['Llamada','Email','WhatsApp','Reunión','Videollamada','Visita a terreno','Presentación','Envío de oferta','Negociación','Nota'];
const MEETING_TYPES=['Reunión','Videollamada','Visita a terreno','Presentación'];
const OFFER_STATES=['Borrador','En revisión','Aprobación interna','Enviada','En seguimiento','Revisada por cliente','Negociación','Aceptada','Rechazada','Vencida','Cancelada'];
const FOLLOW_STATES=['Enviada','En seguimiento','Revisada por cliente'];
const CLOSED_OFFER=['Aceptada','Rechazada','Vencida','Cancelada'];
const LOSS_REASONS=['Precio','Competencia','Cliente postergó','Sin presupuesto','Proveedor actual','Requerimiento técnico','Plazo','Condiciones comerciales','Falta de decisión','Licitación perdida','Proyecto cancelado','Otro'];
const DISQ_REASONS=['Sin necesidad real','Sin presupuesto','Fuera de cobertura','Contrato vigente de largo plazo','Sin acceso al decisor','Otro'];
const SOURCES=['Referido','Referido EPC','Empresa de ingeniería','LinkedIn','Licitación','Evento sectorial','Base importada','Inbound','Prospección directa'];
const SITE_TYPES=['Casa matriz','Planta','Centro de distribución','Faena','Parque fotovoltaico','Parque eólico','Subestación','Oficina','Puerto','Otro'];
const SERVICES=['Guardias','Supervisión','CCTV','Control de acceso','Intrusión / alarmas','Protección perimetral','Analítica de video','LPR','Radares','Monitoreo remoto 24/7','SOC','Comunicaciones','Integración de sistemas','Mantenimiento preventivo','Mantenimiento correctivo','Ingeniería / proyectos'];
const SCORE_VARS=[
 {k:'industria',label:'Industria estratégica',max:12,auto:true},
 {k:'sitios',label:'Número de instalaciones',max:12,opts:[['1 sitio',2],['2 a 4',6],['5 a 9',9],['10 o más',12]]},
 {k:'potencial',label:'Potencial económico',max:12,opts:[['Menos de $50 MM',3],['$50 a $200 MM',7],['$200 a $500 MM',10],['Más de $500 MM',12]]},
 {k:'necesidad',label:'Necesidad identificada',max:10,opts:[['Ninguna',0],['Inferida',5],['Explícita',10]]},
 {k:'decisor',label:'Acceso al decisor',max:10,opts:[['Sin acceso',0],['Vía influenciador',5],['Directo',10]]},

const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function deepMerge(base,over){const out={...base};if(isObj(over))for(const k of Object.keys(over))out[k]=isObj(base[k])&&isObj(over[k])?deepMerge(base[k],over[k]):over[k];return out}
function applyAjustes(){S.config=deepMerge(CONFIG_DEFAULT,S.config||{});if(AJUSTES&&S.mode==='real')S.config=deepMerge(S.config,AJUSTES)}

const DOC_LIMIT=200000;
const STORE={mode:'conectando',db:null,uid:null,ready:false,remoteHas:false,fromLocal:false,written:{},timer:null,queue:Promise.resolve(),status:'',at:''};
const hasUse=()=>!!(window.claude&&window.claude.use);
const docRef=id=>STORE.db.collection('data/users/'+STORE.uid).doc(id);
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));if(STORE.mode==='servidor'&&STORE.ready)localStorage.setItem(KEY+'-rev',String(STORE.rev||0))}catch(e){}}
// Revisión del servidor sobre la que está la copia de este navegador, y si tiene cambios que no se alcanzaron a subir
function localBaseRev(){try{const v=localStorage.getItem(KEY+'-rev');return v===null||v===''?null:Number(v)}catch(e){return null}}
function setPend(on){try{if(on)localStorage.setItem(KEY+'-pend','1');else localStorage.removeItem(KEY+'-pend')}catch(e){}}
function hasPend(){try{return localStorage.getItem(KEY+'-pend')==='1'}catch(e){return false}}
function canSync(){return STORE.ready&&(STORE.remoteHas||S.mode==='real')}
function splitDocs(){
 const meta={};Object.keys(S).forEach(k=>{if(!PARTS.includes(k))meta[k]=S[k]});
 const docs={},parts={};
 PARTS.forEach(k=>{const chunks=[];let cur=[],size=2;(S[k]||[]).forEach(x=>{const n=JSON.stringify(x).length+1;if(cur.length&&size+n>DOC_LIMIT){chunks.push(cur);cur=[];size=2}cur.push(x);size+=n});chunks.push(cur);parts[k]=chunks.length;chunks.forEach((c,i)=>{docs[`crm_${k}_${i}`]={items:c}})});
 meta.parts=parts;docs.crm_meta={meta};return docs}
async function readRemote(){
 const m=await docRef('crm_meta').get();if(!m.exists)return null;
 const body=m.data();const meta=JSON.parse(JSON.stringify(body.meta||{}));const parts=meta.parts||{};delete meta.parts;
 const data={...meta};const written={crm_meta:JSON.stringify(body)};
 for(const k of PARTS){data[k]=[];const n=Number(parts[k])||0;const snaps=await Promise.all(Array.from({length:n},(_,i)=>docRef(`crm_${k}_${i}`).get()));
  snaps.forEach((s,i)=>{if(!s.exists)return;const b=s.data();written[`crm_${k}_${i}`]=JSON.stringify(b);data[k].push(...JSON.parse(JSON.stringify(b.items||[])))})}
 return{data,written}}
function queueRemote(){clearTimeout(STORE.timer);setSync('guardando');STORE.timer=setTimeout(flushRemote,600)}
const remoteMode=()=>STORE.mode==='artefacto'||STORE.mode==='servidor';
const lugar=()=>STORE.mode==='servidor'?'el servidor':'el artefacto';
function flushRemote(){
 STORE.timer=null;
 if(STORE.mode==='servidor')return flushServer();
 const docs=splitDocs();
 STORE.queue=STORE.queue.then(async()=>{
  setSync('guardando');
  try{
   for(const[id,body]of Object.entries(docs)){if(id==='crm_meta')continue;const j=JSON.stringify(body);if(STORE.written[id]===j)continue;await docRef(id).set(JSON.parse(j));STORE.written[id]=j}
   for(const id of Object.keys(STORE.written)){if(id!=='crm_meta'&&!(id in docs)){await docRef(id).delete();delete STORE.written[id]}}
   const mj=JSON.stringify(docs.crm_meta);if(STORE.written.crm_meta!==mj){await docRef('crm_meta').set(JSON.parse(mj));STORE.written.crm_meta=mj}
   STORE.remoteHas=true;if(!STORE.timer)setPend(false);setSync('ok');
  }catch(e){setSync('error',e)}
 })}
// Restaurar respaldo, datos de ejemplo o «Empezar con mis datos» reemplazan todo: el servidor no aplica la regla de bajas
function marcarReemplazo(){try{localStorage.setItem(KEY+'-reemplazo','1')}catch(e){}}
function esReemplazo(){try{return localStorage.getItem(KEY+'-reemplazo')==='1'}catch(e){return false}}
function save(){S.savedAt=Date.now();setPend(true);saveLocal();if(canSync())queueRemote();else setSync(STORE.status)}
function syncText(){
 if(STORE.mode==='conectando')return 'Conectando con el guardado…';
 if(STORE.mode==='clave')return 'Sin sincronizar: falta entrar con tu usuario.';
 if(STORE.mode==='navegador')return 'Guardado solo en este navegador. Descarga un respaldo cada semana.';
 if(!canSync())return `Datos de ejemplo: no se suben ${STORE.mode==='servidor'?'al servidor':'al artefacto'}. Restaura tu respaldo o usa «Empezar con mis datos» en Configuración.`;
 if(STORE.status==='guardando')return `Guardando en ${lugar()}…`;
 if(STORE.status==='error')return `No se pudo guardar en ${lugar()}. Los cambios quedan en este navegador y se reintentan con el próximo cambio.`;
 return STORE.at?`Guardado en ${lugar()} a las ${STORE.at}. Disponible en todos tus dispositivos.`:`Guardado en ${lugar()}. Disponible en todos tus dispositivos.`}
function syncState(){return remoteMode()&&canSync()?STORE.status||'ok':STORE.mode}
function setSync(status,err){
 STORE.status=status;if(status==='ok')STORE.at=new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',hour12:false});
 const el=document.getElementById('syncState');if(el){el.textContent=syncText();el.dataset.state=syncState()}
 avisoConexion();
 if(status==='error')toast(err&&err.code==='quota_exceeded'?'La base del artefacto está llena. Descarga un respaldo y elimina registros antiguos (por ejemplo, la auditoría).':err&&err.message?esc(err.message)+' Los cambios siguen en este navegador.':`No se pudo guardar en ${lugar()}. Los cambios siguen en este navegador.`);
}
function adoptRemote(r){
 if(STORE.fromLocal){try{localStorage.setItem(KEY+'-previo',localStorage.getItem(KEY)||'')}catch(e){}}
 if(STORE.mode==='servidor')STORE.base=clon(r.data);
 S=r.data;migrate();if(r.written)STORE.written=r.written;STORE.remoteHas=true;saveLocal();setPend(false);
}
// Decide qué hacer al conectar: tomar lo del servidor/artefacto o subir lo local
// remoteRev: revisión actual del servidor. En el artefacto no hay revisión y la copia local nunca pisa datos reales.
function reconcile(remoteData,push,donde,remoteRev){
 const localReal=STORE.fromLocal&&S.mode==='real';
 if(remoteData){
  const remoteReal=remoteData.mode==='real';
  if(localReal&&!remoteReal){push('todo');toast(`Se subieron a ${donde} los cambios guardados en este navegador.`);return}
  if(localReal&&hasPend()){
   const base=localBaseRev();
   if(remoteRev!=null&&base!=null&&base===remoteRev){push();toast(`Se subieron a ${donde} los cambios guardados en este navegador.`);return}
   STORE.avisoPrevio=true;   // cambios locales hechos sobre una versión antigua: no se suben
  }
  return 'adopt';
 }
 if(localReal){push('todo');toast(`Listo: tus datos quedaron guardados en ${donde}. Ya puedes abrir el CRM desde el celular u otro computador.`)}
}
function avisoPrevio(){
 if(!STORE.avisoPrevio)return;STORE.avisoPrevio=false;
 openModal(`<h1 style="font-size:20px">Se cargó la versión del servidor</h1><p class="sm">Este navegador tenía cambios hechos sobre una versión antigua de los datos. Para no borrar lo que se guardó después desde otro dispositivo o por Joan, no se subieron: se cargó la versión del servidor.</p><p class="sm">Si registraste algo aquí sin conexión, revisa que esté y, si falta, vuelve a hacerlo. La copia de este navegador queda guardada por si la necesitas.</p><div class="form-foot"><button class="btn" data-action="previoBackup">Descargar copia de este navegador</button><button class="btn pri" data-action="closeModal">Entendido</button></div>`)}
async function connectStore(){
 if(!hasUse())return connectServer();
 let db=null,user=null;
 try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){db=null}
 let uid=null;try{uid=user?await user.id():null}catch(e){uid=null}
 if(!db||!uid){STORE.mode='navegador';render();return}
 STORE.db=db;STORE.uid=uid;
 let r=null;
 try{r=await readRemote()}catch(e){STORE.mode='navegador';render();return}
 STORE.mode='artefacto';STORE.ready=true;
 if(r)STORE.written=r.written;
 if(reconcile(r&&r.data,()=>{STORE.remoteHas=!!r;flushRemote()},'el artefacto')==='adopt'){adoptRemote(r);closeDrawer();avisoPrevio()}
 render();
}
async function refreshFromRemote(){
 if(!STORE.ready||STORE.timer||document.visibilityState!=='visible')return;
 if(STORE.mode==='servidor')return refreshFromServer();
 try{const m=await docRef('crm_meta').get();if(!m.exists)return;const ts=Number((m.data().meta||{}).savedAt)||0;
  if(ts>(S.savedAt||0)){await STORE.queue;const r=await readRemote();if(!r)return;adoptRemote(r);render();toast('Datos actualizados con los cambios hechos en otro dispositivo.')}}catch(e){}
}

/* ---------- Guardado en el servidor propio (api.php en el hosting) ---------- */
const API='api.php';
// Cada persona entra con su cuenta: la sesión va en una cookie HttpOnly (el programa no la ve) y cada petición lleva X-CRM: 1
try{localStorage.removeItem('crm-clave')}catch(e){}   // clave compartida de la versión de una sola persona: ya no se usa
// El cuerpo va comprimido (gzip): pesa ~85% menos y no lo bloquean los filtros del hosting (ModSecurity) que limitan o inspeccionan JSON grandes
async function gzipBody(txt){
 if(typeof CompressionStream!=='function')return null;
 try{return await new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'))).blob()}catch(e){return null}
}
async function api(method,q,body){
 const headers={'Content-Type':'application/json','X-CRM':'1'};let payload;
 if(body){payload=JSON.stringify(body);const gz=await gzipBody(payload);if(gz){payload=gz;headers['Content-Type']='application/octet-stream';headers['X-CRM-Gzip']='1'}}
 const r=await fetch(API+(q||''),{method,headers,body:payload,cache:'no-store',credentials:'same-origin'});
 let j=null;try{j=await r.json()}catch(e){j=null}
 return{status:r.status,j};
}
async function connectServer(){
 if(!/^https?:$/.test(location.protocol)){STORE.mode='navegador';render();return}
 let r;try{r=await api('GET','?accion=leer')}catch(e){STORE.motivo='No se pudo contactar al servidor (¿sin internet o venció la sesión?).';STORE.mode='navegador';render();return}
 if(!r.j||r.status===404){STORE.motivo=r.status===404?'':'El servidor no respondió como se esperaba (¿venció la sesión de Cloudflare?). Recarga la página.';STORE.mode='navegador';render();return}          // no hay api.php
 if(r.status===401){STORE.mode='clave';render();pedirEntrada('');return}
 if(r.status===503){STORE.mode='navegador';render();toast(esc(r.j.error||'Falta configurar el servidor.'));return}
 if(r.status===429){STORE.mode='clave';render();pedirEntrada(r.j.error||'Demasiados intentos. Espera unos minutos.');return}
 if(r.status!==200){STORE.motivo=r.status===403&&r.j&&r.j.error?r.j.error:'El servidor respondió con un error ('+r.status+'). No registres nada hasta que vuelva la conexión.';STORE.mode='navegador';render();return}
 STORE.mode='servidor';STORE.ready=true;STORE.rev=Number(r.j.rev)||0;STORE.almacen=r.j.almacen||null;STORE.remoteHas=!!r.j.data;
 if(r.j.yo)aplicarSesion(r.j.yo,r.j.usuarios);
 STORE.base=r.j.data?clon(r.j.data):null;
 if(reconcile(r.j.data,flushServer,'el servidor',STORE.rev)==='adopt'){adoptRemote({data:r.j.data});closeDrawer();avisoPrevio()}
 syncAjustes(r.j.ajustes);
 render();
 joanInit();
}
/* Guardado registro por registro (el servidor lo explica en guardado.php)
   STORE.base es la última versión que llegó del servidor. Al guardar se manda solo lo que cambió respecto de ella,
   registro por registro y con la versión que había: el servidor junta lo que otras personas guardaron entremedio y
   devuelve como conflicto solo lo que dos personas cambiaron a la vez. La copia completa se usa solo al iniciar el
   CRM, al restaurar un respaldo o cuando no hay versión del servidor con qué comparar. */
const clon=x=>x==null?x:JSON.parse(JSON.stringify(x));
const NO_SUBIR=['users','currentUser'];
const esColeccion=v=>Array.isArray(v)&&v.every(x=>x&&typeof x==='object'&&!Array.isArray(x)&&x.id!=null&&x.id!=='');
function difDatos(base,act){
 const registros=[],doc=[];const J=x=>JSON.stringify(x);
 for(const k of Object.keys(act||{})){
  if(NO_SUBIR.includes(k))continue;
  const a=base?base[k]:undefined,b=act[k];
  if(esColeccion(b)&&(a===undefined||esColeccion(a))){
   const A=new Map((a||[]).map(x=>[String(x.id),x]));const vistos=new Set();let prev=null;
   for(const x of b){const id=String(x.id);vistos.add(id);const ax=A.get(id);
    if(!ax)registros.push({t:k,id:x.id,antes:null,despues:x,tras:prev});
    else if(J(ax)!==J(x))registros.push({t:k,id:x.id,antes:ax,despues:x});
    prev=x.id}
   if(k!=='audit')for(const[id,ax]of A)if(!vistos.has(id))registros.push({t:k,id:ax.id,antes:ax,despues:null});   // la auditoría no se borra
  }else if(J(a)!==J(b))doc.push({k,antes:a===undefined?null:a,despues:b});
 }
 return{registros,doc}}
const difVacia=c=>!c.registros.length&&c.doc.every(x=>x.k==='savedAt');
// Aplica cambios sobre d sin revisar conflictos (los revisa el servidor al guardar)
function aplicarDif(d,c){
 for(const r of c.registros){if(!Array.isArray(d[r.t]))d[r.t]=[];const L=d[r.t];const i=L.findIndex(x=>String(x.id)===String(r.id));
  if(r.despues===null){if(i>=0)L.splice(i,1);continue}
  if(i>=0){L[i]=clon(r.despues);continue}
  if(r.antes!==null)continue;   // otra persona lo eliminó: no se revive
  const j=r.tras==null?-1:L.findIndex(x=>String(x.id)===String(r.tras));
  if(r.tras==null)L.unshift(clon(r.despues));else if(j>=0)L.splice(j+1,0,clon(r.despues));else L.push(clon(r.despues))}
 for(const x of c.doc)d[x.k]=clon(x.despues);
 return d}
// Toma la versión del servidor y vuelve a poner encima lo que la persona cambió y todavía no se guardó (respecto de ref)
function tomarServidor(data,ref){
 const pend=ref?difDatos(ref,S):null;
 STORE.base=clon(data);S=clon(data);migrate();
 if(pend)aplicarDif(S,pend);
 saveLocal();
 if(pend&&!difVacia(pend)){setPend(true);queueRemote()}
}
const TABLA_NOMBRE={companies:'la empresa',contacts:'el contacto',leads:'el prospecto',opps:'la oportunidad',offers:'la oferta',plans:'el plan',activities:'la actividad',tasks:'la tarea',invoices:'la factura',recepciones:'el acta',doc:''};
function avisarConflictos(cs){
 const hora=x=>x?new Date(x).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',hour12:false}):'';
 openModal(`<h1 style="font-size:20px">Otra persona cambió lo mismo</h1><p class="sm">Mientras trabajabas, otra persona guardó cambios en ${cs.length===1?'este registro':'estos registros'}. Quedó su versión; lo demás que hiciste sí se guardó.</p><ul class="sm" style="padding-left:18px">${cs.map(c=>`<li>${esc((TABLA_NOMBRE[c.t]??'')+' «'+(c.nombre||c.id)+'»')}: ${c.motivo==='eliminado'?'lo eliminaron':'lo cambió '+(c.quien?esc(c.quien):'otra persona')+(c.en?' a las '+hora(c.en):'')}</li>`).join('')}</ul><p class="sm">Revísalo y, si hace falta, vuelve a hacer tu cambio.</p><div class="form-foot"><button class="btn pri" data-action="closeModal">Entendido</button></div>`)}
function flushServer(modo){
 STORE.timer=null;
 if(modo==='todo')STORE.base=null;
 STORE.queue=STORE.queue.then(async()=>{
  setSync('guardando');
  try{
   const reemp=esReemplazo();const enviado=clon(S);
   const cambios=!reemp&&STORE.base?difDatos(STORE.base,enviado):null;
   if(cambios&&difVacia(cambios)){if(!STORE.timer)setPend(false);setSync('ok');return}   // nada que guardar
   const r=await api('POST','',cambios?{baseRev:STORE.rev||0,cambios}:Object.assign({baseRev:STORE.rev||0,data:S},reemp?{reemplazo:true}:{}));
   if(r.status===200&&reemp){try{localStorage.removeItem(KEY+'-reemplazo')}catch(e){}}
   if(r.status===422&&r.j&&r.j.rechazo&&r.j.data){STORE.rev=Number(r.j.rev)||0;adoptRemote({data:r.j.data});render();setSync('ok');openModal(`<h1 style="font-size:20px">El servidor no aceptó el cambio</h1><p class="sm">${esc(r.j.error||'')}</p><p class="sm">Se cargó la versión del servidor, sin ese cambio.</p><div class="form-foot"><button class="btn pri" data-action="closeModal">Entendido</button></div>`);return}
   if(r.status===200&&r.j){
    STORE.rev=Number(r.j.rev)||0;STORE.remoteHas=true;try{localStorage.setItem(KEY+'-rev',String(STORE.rev))}catch(e){}
    const codigos=r.j.codigos&&Object.keys(r.j.codigos).length;
    if(r.j.data){tomarServidor(r.j.data,enviado);render()}
    else if(cambios){
     // Nadie más guardó entremedio: la base queda con lo enviado y con lo que puso el servidor (códigos, trazabilidad)
     aplicarDif(STORE.base,cambios);const J=x=>JSON.stringify(x);
     for(const x of r.j.registros||[]){
      const B=STORE.base[x.t]||(STORE.base[x.t]=[]);const bi=B.findIndex(y=>String(y.id)===String(x.id));
      if(x.datos===null){if(bi>=0)B.splice(bi,1)}else if(bi>=0)B[bi]=clon(x.datos);else B.push(clon(x.datos));
      // en la pantalla, solo si la persona no lo volvió a cambiar mientras se guardaba
      const L=S[x.t]||[],si=L.findIndex(y=>String(y.id)===String(x.id)),e=(enviado[x.t]||[]).find(y=>String(y.id)===String(x.id));
      if(si>=0&&J(L[si])===J(e)){if(x.datos===null)L.splice(si,1);else L[si]=clon(x.datos)}}
     for(const[k,v]of Object.entries(r.j.doc||{})){STORE.base[k]=clon(v);if(J(S[k])===J(enviado[k]))S[k]=clon(v);else if(k==='seq'&&S.seq&&v)Object.keys(v).forEach(n=>{if(!(n in S.seq)||(typeof v[n]==='number'&&v[n]>S.seq[n])||typeof v[n]==='string')S.seq[n]=v[n]})}
     saveLocal();if(codigos)render();
    }else STORE.base=enviado;
    if(!STORE.timer)setPend(false);setSync('ok');
    if(r.j.conflictos&&r.j.conflictos.length)avisarConflictos(r.j.conflictos);
    else if(Array.isArray(r.j.avisos)&&r.j.avisos.length)openModal(`<h1 style="font-size:20px">Parte del cambio no se guardó</h1>${r.j.avisos.map(a=>`<p class="sm">${esc(a)}</p>`).join('')}<p class="sm">Lo demás quedó guardado. Se cargó la versión del servidor.</p><div class="form-foot"><button class="btn pri" data-action="closeModal">Entendido</button></div>`);
    if(codigos)toast(Object.values(r.j.codigos).length===1?`Código asignado: ${esc(Object.values(r.j.codigos)[0])}.`:`Códigos asignados: ${Object.values(r.j.codigos).map(esc).join(', ')}.`);
    return}
   if(r.status===409&&r.j&&r.j.data){STORE.rev=Number(r.j.rev)||0;adoptRemote({data:r.j.data});render();setSync('ok');openModal('<h1 style="font-size:20px">Había cambios en otro dispositivo</h1><p class="sm">Mientras trabajabas aquí, se guardaron cambios desde otro dispositivo. Se cargó la versión más reciente del servidor. Revisa tu último cambio y, si no aparece, vuelve a hacerlo.</p><div class="form-foot"><button class="btn pri" data-action="closeModal">Entendido</button></div>');return}
   if(r.status===401){STORE.mode='clave';STORE.ready=false;setSync('');render();pedirEntrada('Tu sesión terminó. Vuelve a entrar: tus cambios siguen en este navegador y se suben al entrar.');return}
   if(r.status===403&&r.j&&r.j.error){setSync('');toast(esc(r.j.error));return}
   if(r.status===429){setSync('');toast(esc(r.j&&r.j.error||'Demasiados intentos. Espera unos minutos.'));return}
   throw new Error((r.j&&r.j.error)||(r.status===403||r.status===406||r.status===413?'El hosting bloqueó el guardado (código '+r.status+'). Revisa ModSecurity en cPanel.':'El servidor respondió con un error ('+r.status+').'));
  }catch(e){setSync('error',e)}
 })}
async function refreshFromServer(forzar){
 try{const r=await api('GET','?accion=rev');if(r.status===401&&STORE.mode==='servidor'){STORE.mode='clave';STORE.ready=false;render();pedirEntrada('Tu sesión terminó. Vuelve a entrar.');return}
  if(r.status!==200||!r.j)return;if(r.j.almacen)STORE.almacen=r.j.almacen;
  if(r.j.ajustes&&syncAjustes(r.j.ajustes))render();
  if(forzar===true||(Number(r.j.rev)||0)>(STORE.rev||0)){await STORE.queue;if(STORE.timer)return;const f=await api('GET','?accion=leer');if(f.status!==200||!f.j||!f.j.data)return;STORE.rev=Number(f.j.rev)||0;if(STORE.base)tomarServidor(f.j.data,STORE.base);else adoptRemote({data:f.j.data});if(f.j.yo)aplicarSesion(f.j.yo,f.j.usuarios);render();if(forzar!==true)toast('Datos actualizados con los cambios hechos por otra persona o en otro dispositivo.')}}catch(e){}
}

/* ---------- Chat con Joan (solo por Tailscale; api.php lo rechaza desde internet) ---------- */
var JOAN={on:false,abierto:false,hilo:'',msgs:[],esperando:null,KEY:'crm-joan-chat'};
function joanCargar(){try{const j=JSON.parse(sessionStorage.getItem(JOAN.KEY)||'{}');JOAN.hilo=j.hilo||'';JOAN.msgs=Array.isArray(j.msgs)?j.msgs.slice(-60):[];JOAN.esperando=j.esperando||null}catch(e){}}
function joanGuardar(){try{sessionStorage.setItem(JOAN.KEY,JSON.stringify({hilo:JOAN.hilo,msgs:JOAN.msgs.slice(-60),esperando:JOAN.esperando}))}catch(e){}}
async function joanApi(method,q,body){
 const r=await fetch(API+q,{method,headers:{'Content-Type':'application/json','X-CRM':'1'},body:body?JSON.stringify(body):undefined,cache:'no-store',credentials:'same-origin'});
 let j=null;try{j=await r.json()}catch(e){}
 return{status:r.status,j:j||{}};
}
async function joanInit(){
 if(JOAN.on||STORE.mode!=='servidor')return;
 let r;try{r=await joanApi('GET','?accion=joan-estado')}catch(e){return}
 if(r.status!==200)return;               // fuera de Tailscale, sin servicio o sin instalar: no se muestra
 JOAN.on=true;joanCargar();joanPintar();
 if(JOAN.esperando)joanSondear(JOAN.esperando);
}
function joanCtx(){
 if(CUR){const {type,id}=CUR;
  if(type==='lead'){const l=byId(S.leads,id);if(l)return `Prospecto ${l.code||''} · ${cname(l.companyId)}${l.name?' · '+l.name:''} · etapa ${l.stage}${l.contactId?' · contacto '+ctname(l.contactId):''}`}
  if(type==='opp'){const o=byId(S.opps,id);if(o)return `Oportunidad ${o.code||''} · ${cname(o.companyId)} · ${o.name}`}
  if(type==='company'){const c=byId(S.companies,id);if(c)return `Empresa ${c.tradeName||c.legalName}`}
  if(type==='contact'){const k=byId(S.contacts,id);if(k)return `Contacto ${k.firstName} ${k.lastName}${k.position?' ('+k.position+')':''} · ${cname(k.companyId)}`}
  if(type==='offer'){const f=byId(S.offers,id);if(f)return `Oferta ${f.code||''}`}
 }
 const v=currentView();return `Vista ${v}`;
}
function joanCtxAct(){if(typeof JOAN==='undefined'||!JOAN.abierto)return;const n=$('.jctx');if(n)n.textContent='Pantalla: '+joanCtx()}
function joanFmt(t){return esc(t).replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function joanPintar(){
 const L=$('#joanLayer');if(!L)return;
 if(!JOAN.on){L.innerHTML='';return}
 if(!JOAN.abierto){L.innerHTML=`<button class="jfab" data-action="joanAbrir" aria-label="Abrir chat con Joan"><span class="jdot"></span>Joan${JOAN.esperando?' …':''}</button>`;return}
 const msgs=JOAN.msgs.map(m=>`<div class="jm ${m.de}">${joanFmt(m.t)}${m.ctx&&m.de==='yo'?`<span class="jc">${esc(m.ctx)}</span>`:''}</div>`).join('')||`<div class="jm joan">Hola${me().name?', '+esc(primerNombre(me().name)):''}. Pregúntame por el pipeline o pídeme registrar algo. Si tienes una ficha abierta, puedes decir «este prospecto» o «este contacto».</div>`;
 const espera=JOAN.esperando?`<div class="jm joan" data-jespera>Joan está revisando…</div>`:'';
 const yaTenia=$('#jtexto')?$('#jtexto').value:'';
 L.innerHTML=`<section class="jchat" role="dialog" aria-label="Chat con Joan"><header><b>Joan</b><button data-action="joanNueva" title="Empezar una conversación nueva">Nueva</button><button data-action="joanCerrar" aria-label="Minimizar">✕</button></header>
 <div class="jctx">Pantalla: ${esc(joanCtx())}</div>
 <div class="jmsgs" id="jmsgs">${msgs}${espera}</div>
 <form class="jform" data-form="joan"><textarea id="jtexto" rows="1" placeholder="Escribe a Joan…" aria-label="Mensaje para Joan"></textarea><button type="submit" ${JOAN.esperando?'disabled':''}>Enviar</button></form></section>`;
 const ta=$('#jtexto');ta.value=yaTenia;
 ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();joanEnviar()}});
 const box=$('#jmsgs');box.scrollTop=box.scrollHeight;
}
async function joanEnviar(){
 const ta=$('#jtexto');const texto=(ta&&ta.value||'').trim();
 if(!texto||JOAN.esperando)return;
 const ctx=joanCtx();ta.value='';
 JOAN.msgs.push({de:'yo',t:texto,ctx});JOAN.esperando='enviando';joanGuardar();joanPintar();
 let r;try{r=await joanApi('POST','?accion=joan',{texto,contexto:ctx,hilo:JOAN.hilo})}catch(e){r={status:0,j:{}}}
 if(r.status!==200||!r.j.id){JOAN.esperando=null;JOAN.msgs.push({de:'err',t:r.j.error||'No pude hablar con Joan. Revisa la conexión con el servidor.'});joanGuardar();joanPintar();return}
 JOAN.hilo=r.j.hilo||JOAN.hilo;JOAN.esperando=r.j.id;joanGuardar();joanPintar();joanSondear(r.j.id);
}
async function joanSondear(id){
 const ini=Date.now();
 while(JOAN.esperando===id){
  await new Promise(res=>setTimeout(res,2000));
  let r;try{r=await joanApi('GET','?accion=joan-respuesta&id='+encodeURIComponent(id))}catch(e){continue}
  if(JOAN.esperando!==id)return;
  if(r.status===200&&(r.j.estado==='listo'||r.j.estado==='error')){
   JOAN.esperando=null;JOAN.msgs.push({de:r.j.estado==='listo'?'joan':'err',t:r.j.texto||'Sin respuesta.'});joanGuardar();joanPintar();
   refreshFromRemote();   // si Joan registró algo, se ve al tiro
   return}
  if(r.status===200){const n=$('[data-jespera]');if(n)n.textContent=r.j.posicion>1?`En cola (${r.j.posicion - 1} antes)…`:`Joan está revisando… ${Math.round((Date.now()-ini)/1000)} s`;continue}
  if(r.status===404||r.status===403||r.status===503){JOAN.esperando=null;JOAN.msgs.push({de:'err',t:r.j.error||'Se perdió la respuesta. Envía el mensaje de nuevo.'});joanGuardar();joanPintar();return}
  if(Date.now()-ini>6*60000){JOAN.esperando=null;JOAN.msgs.push({de:'err',t:'Joan no respondió a tiempo. Inténtalo de nuevo.'});joanGuardar();joanPintar();return}
 }
}

async function fileSave(filename,data){

  // Fuera de Claude (sitio propio): descarga normal del navegador
  try{const type=filename.endsWith('.csv')?'text/csv;charset=utf-8':filename.endsWith('.xlsx')?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/json';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);return 'ok'}catch(e){return 'na'}
 }
 if(!d)return 'na';
 try{await d.save({filename,data});return 'ok'}catch(e){return e&&e.code==='declined'?'declined':e&&e.code==='rate_limited'?'busy':'na'}

const tcv=o=>o.fx&&Number(o.fx.proj)>0?Number(o.fx.proj):toCLP((Number(o.oneTime)||0)+(Number(o.monthly)||0)*(Number(o.term)||0),o.currency);

function lastAct(type,id){let m=null;for(const a of S.activities){if(a.entityType===type&&a.entityId===id&&a.date<=todayIso&&!isSysAct(a)&&(!m||a.date>m))m=a.date}return m}
function lastActOpp(o){let m=lastAct('opp',o.id);for(const t of S.tasks)if(t.entityType==='opp'&&t.entityId===o.id&&t.status==='Completada'&&t.completedAt&&t.completedAt<=todayIso&&(!m||t.completedAt>m))m=t.completedAt;const fu=o.fx&&o.fx.ult;if(fu&&fu<=todayIso&&(!m||fu>m))m=fu;for(const of of S.offers.filter(f=>f.oppId===o.id)){const x=lastAct('offer',of.id);if(x&&(!m||x>m))m=x}return m}
function missing(o){if(o.status&&o.status!=='abierta')return[];if(enExcel(o)){const t=nextTask(o);return !t?['tarea pendiente']:t.due<todayIso?['tarea vencida']:[]}const m=[];if(!o.ownerId)m.push('responsable');if(!o.stage)m.push('etapa');if(!(tcv(o)>0))m.push('monto');if(!(Number(o.prob)>0))m.push('probabilidad');if(!o.closeDate)m.push('fecha de cierre');if(!o.nextAction)m.push('próxima acción');if(!o.nextActionDate)m.push('fecha de próxima acción');else if(o.nextActionDate<todayIso)m.push('próxima acción vencida');return m}

function score(l){const co=byId(S.companies,l.companyId);const parts=SCORE_VARS.map(v=>{if(v.auto){const ind=co?.industry;const p=!ind?0:STRATEGIC.includes(ind)?12:MID_IND.includes(ind)?8:4;return{label:v.label,pts:p,max:v.max,val:ind||'sin dato'}}const i=l.vars?.[v.k];if(i===undefined||i===''||i===null)return{label:v.label,pts:0,max:v.max,val:null};const o=v.opts[Number(i)];return{label:v.label,pts:o[1],max:v.max,val:o[0]}});const total=sum(parts,p=>p.pts);return{total,grade:total>=70?'A':total>=45?'B':'C',parts}}

function oppFollow(o){if(o.status!=='abierta'||o.stage!=='seguimiento')return null;const ent=(o.fx&&o.fx.pres)||o.stageEnteredAt;if(!ent)return null;const la=lastActOpp(o);const ref=la&&la>ent?la:ent;const d=daysFrom(ref);const R=plazo(o);
 if(d>=R.red)return{sev:'bad',d,label:`${d} días sin seguimiento desde la entrega`};if(d>=R.yellow)return{sev:'warn',d,label:`${d} días sin seguimiento desde la entrega`};if(d>=R.remind)return{sev:'info',d,label:`Recordar seguimiento (${d} días)`};return{sev:'ok',d,label:`Al día (${d} días)`}}

/* ============ PLANES DE PROSPECCIÓN ============ */
function planProgress(p){
 const[st,en]=planRange(p);const upto=en<todayIso?en:todayIso;
 const ids=new Set(p.targets.map(t=>t.companyId));
 const acts=S.activities.filter(a=>ids.has(a.companyId)&&a.date>=st&&a.date<=upto);
 const opps=S.opps.filter(o=>ids.has(o.companyId)&&o.createdAt>=st&&o.createdAt<=en);
 const r={empresas:new Set(acts.map(a=>a.companyId)).size,contactos:S.contacts.filter(k=>ids.has(k.companyId)&&k.createdAt>=st&&k.createdAt<=en).length,llamadas:acts.filter(a=>a.type==='Llamada').length,reuniones:acts.filter(a=>['Reunión','Videollamada','Presentación'].includes(a.type)).length,visitas:acts.filter(a=>a.type==='Visita a terreno').length,oportunidades:opps.length,pipeline:sum(opps,tcv)};
 const wg=PLAN_METRICS.filter(([k])=>p.goals[k]>0);
 const pct=wg.length?Math.round(sum(wg,([k])=>Math.min(r[k]/p.goals[k],1))/wg.length*100):0;
 const total=Math.round((parse(en)-parse(st))/86400000)+1;const elapsed=todayIso<st?0:todayIso>en?total:Math.round((TODAY-parse(st))/86400000)+1;
 return{r,pct,expected:Math.round(elapsed/total*100),st,en};
}
// Tiempo del plan en días hábiles (lunes a viernes) y empresas que faltan por activar: siempre visibles en el plan
function planClock(p){const[st,en]=planRange(p);let tot=0,pas=0;for(let d=parse(st);iso(d)<=en;d.setDate(d.getDate()+1)){const w=d.getDay();if(w===0||w===6)continue;tot++;if(iso(d)<=todayIso)pas++}
 const quedan=tot-pas+(todayIso>=st&&todayIso<=en&&![0,6].includes(TODAY.getDay())?1:0);
 const txt=todayIso<st?`Empieza el ${fmtDate(st)} (${tot} días hábiles)`:todayIso>en?`Terminó el ${fmtDate(en)}`:`Día ${Math.max(pas,1)} de ${tot} · ${quedan===1?'queda 1 día hábil':'quedan '+quedan+' días hábiles'}`;
 return{tot,pas,quedan:todayIso>en?0:todayIso<st?tot:quedan,txt,pct:tot?Math.round(Math.min(pas,tot)/tot*100):0,fin:todayIso>en}}
function planPorActivar(p){const vivos=p.targets.filter(t=>t.status!=='Descartado');const pend=vivos.filter(t=>t.status==='Pendiente').length,busca=vivos.filter(t=>t.status==='Buscar contacto').length;
 return{total:vivos.length,falta:pend+busca,pend,busca,activas:vivos.length-pend-busca}}
const porActivarTxt=a=>a.total?(a.falta?`Faltan ${a.falta} de ${a.total} por activar`+(a.busca?` (${a.busca} buscando contacto)`:''):`Las ${a.total} activadas`):'Sin empresas';

const LINKEDIN_RE=/linkedin\.com\/\S+/i;

function medioContacto(k){if(!k)return '';const m=[];if((k.email||'').trim())m.push('correo');if((k.phone||'').trim()||(k.whatsapp||'').trim())m.push('teléfono');if(LINKEDIN_RE.test(k.notes||''))m.push('LinkedIn');return m.join(', ')}

const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();

// Contactos identificados de una empresa objetivo (pueden ser varios: uno por operación)
const targetIds=t=>Array.isArray(t.contactIds)?t.contactIds:(t.contactId?[t.contactId]:[]);
function targetContacts(t){return targetIds(t).map(id=>byId(S.contacts,id)).filter(Boolean)}
function targetContact(t){const ks=targetContacts(t);if(ks.length)return ks.find(contactoEfectivo)||ks[0];const all=S.contacts.filter(x=>x.companyId===t.companyId);return all.find(contactoEfectivo)||all[0]||null}

function targetEffContacts(t){const ks=targetContacts(t);if(ks.length)return ks.filter(contactoEfectivo);const k=S.contacts.find(x=>x.companyId===t.companyId&&contactoEfectivo(x));return k?[k]:[]}

function ensureLead(p,companyId,t,kk){
 const abierto=x=>x.companyId===companyId&&!['Oportunidad creada','No calificado'].includes(x.stage);
 const k=kk||(t?targetEffContact(t):S.contacts.find(c=>c.companyId===companyId&&contactoEfectivo(c)));
 // Un prospecto por contacto: se reutiliza el abierto de ese contacto; si no, uno de la empresa que aún no tenga contacto efectivo
 let l=k?S.leads.find(x=>abierto(x)&&x.contactId===k.id):S.leads.find(abierto);
 if(!l&&k)l=S.leads.find(x=>abierto(x)&&!contactoEfectivo(byId(S.contacts,x.contactId))&&(!x.planId||x.planId===p.id));
 if(l&&k&&!contactoEfectivo(byId(S.contacts,l.contactId))){l.contactId=k.id;if(k.siteId&&!l.siteId)l.siteId=k.siteId}
 const op=k&&k.siteId?siteLabel(companyId,k.siteId):'';
 if(!l){l={id:uid('l'),code:newLeadCode(),name:[p.service||(t&&t.need?t.need.slice(0,60):''),op].filter(Boolean).join(' · '),stageAt:todayIso,companyId,contactId:k?k.id:'',siteId:k&&k.siteId||'',source:'Plan: '+p.name,stage:'Identificado',potential:'Medio',problem:t&&t.need||'',service:p.service||'',ownerId:p.ownerId,nextAction:'',nextActionDate:'',vars:{},createdAt:todayIso,planId:p.id};S.leads.push(l)}
 else if(!l.planId)l.planId=p.id;

// Quita empresas objetivo de un plan. Con dry=true solo cuenta lo que pasaría.
// Borra: las tareas abiertas del plan de esas empresas; los prospectos que creó el plan y no tienen actividad
// (y sus tareas); y las empresas que llegaron con una carga (Joan, SEIA, prospección o el plan) y no tienen
// nada más en el CRM (sin actividades, oportunidades, ofertas, otros prospectos ni otros planes), con sus contactos.
function targetRemoval(p,ids,dry){
 const set=new Set(ids);const r={tasks:0,leads:0,keepLeads:0,companies:0,keepCompanies:0,contacts:0};
 const delLeads=new Set(),delComp=new Set(),delTasks=new Set();
 for(const cid of set){
  const leads=S.leads.filter(l=>l.companyId===cid&&l.planId===p.id);
  S.tasks.filter(t=>t.planId===p.id&&isOpenTask(t)&&(leads.some(l=>l.id===t.entityId)||(t.entityType==='company'&&t.entityId===cid))).forEach(t=>delTasks.add(t.id));
  for(const l of leads){const acts=S.activities.some(a=>a.entityType==='lead'&&a.entityId===l.id);if(!acts&&!l.oppId){delLeads.add(l.id);S.tasks.filter(t=>t.entityType==='lead'&&t.entityId===l.id).forEach(t=>delTasks.add(t.id))}else{r.keepLeads++;if(!dry&&!leadClosed(l))setLeadStage(l,'No calificado')}}
  const c=byId(S.companies,cid);if(!c)continue;
  const fromLoad=/^(Joan|SEIA|Prospección semanal|Plan: )/.test(c.source||'');
  const busy=(c.sites||[]).length>0||S.activities.some(a=>a.companyId===cid)||S.opps.some(o=>o.companyId===cid)||(S.offers||[]).some(o=>o.companyId===cid)||S.leads.some(l=>l.companyId===cid&&!delLeads.has(l.id))||S.plans.some(x=>x.id!==p.id&&x.targets.some(t=>t.companyId===cid))||S.tasks.some(t=>t.entityType==='company'&&t.entityId===cid&&!delTasks.has(t.id));
  if(fromLoad&&!busy){delComp.add(cid);r.contacts+=S.contacts.filter(k=>k.companyId===cid).length}else r.keepCompanies++;
 }
 r.tasks=delTasks.size;r.leads=delLeads.size;r.companies=delComp.size;
 if(dry)return r;
 p.targets=p.targets.filter(t=>!set.has(t.companyId));
 S.tasks=S.tasks.filter(t=>!delTasks.has(t.id));S.leads=S.leads.filter(l=>!delLeads.has(l.id));
 S.contacts=S.contacts.filter(k=>!delComp.has(k.companyId));S.companies=S.companies.filter(c=>!delComp.has(c.id));
 return r;
}
// Pasa las empresas de los planes mensuales en Borrador al plan único de la semana en que llegaron
// (semana ISO de la fecha de carga). Los planes activos o cerrados no se tocan. Con dry=true solo cuenta.
function monthlyToWeekly(dry){
 const src=mine(S.plans).filter(p=>!p.week&&p.status==='Borrador');const r={plans:src.length,moved:0,dup:0,weeks:{}};
 for(const p of src)for(const t of p.targets){
  const wk=isoWeekOf(t.addedAt||p.createdAt||todayIso);r.weeks[wk]=(r.weeks[wk]||0)+1;if(dry){r.moved++;continue}
  let w=S.plans.find(x=>x.week===wk&&x.ownerId===p.ownerId);
  if(!w){w=makePlan(ALL_VERT,wk,p.ownerId);S.plans.push(w);audit(w.name,'Creación','','Borrador (desde planes mensuales)')}
  if(w.targets.some(x=>x.companyId===t.companyId)){r.dup++;continue}
  w.targets.push({...t,source:t.source||('Plan '+p.name)});r.moved++;
 }
 if(dry)return r;
 const ids=new Set(src.map(p=>p.id));S.plans=S.plans.filter(p=>!ids.has(p.id));
 src.forEach(p=>audit(p.name,'Pasado a plan semanal','Borrador',p.targets.length+' empresas'));
 return r;
}

 }

 }

/* ============ REPORTES POR PERÍODO ============ */
const GRAN={mes:'Mensual',trimestre:'Trimestral',anio:'Anual'};
function perKey(s,g){const[y,m]=s.slice(0,7).split('-').map(Number);return g==='mes'?`${y}-${String(m).padStart(2,'0')}`:g==='trimestre'?`${y}-T${Math.ceil(m/3)}`:String(y)}
function perLabel(k,g){if(k==='todo')return 'todo el historial';if(g==='mes')return parse(k+'-01').toLocaleDateString('es-CL',{month:'short',year:'2-digit'}).replace('.','');if(g==='trimestre'){const[y,q]=k.split('-T');return `T${q} ${y}`}return k}
function perList(os,g){
 const ds=os.flatMap(o=>[o.createdAt,o.wonAt,o.lostAt]).filter(s=>s&&/^\d{4}-\d{2}/.test(s)&&s<=todayIso).sort();
 const st=parse((ds[0]||todayIso).slice(0,10));const d=new Date(st.getFullYear(),st.getMonth(),1);const ks=[];
 while(d<=TODAY){const k=perKey(iso(d),g);if(!ks.includes(k))ks.push(k);d.setMonth(d.getMonth()+1)}
 return ks.slice(-({mes:12,trimestre:8,anio:5})[g])}
function perStats(os,k,g){
 const inP=s=>!!s&&(k==='todo'||perKey(s,g)===k);
 const nuevas=os.filter(o=>inP(o.createdAt));const won=os.filter(o=>o.status==='ganada'&&inP(o.wonAt));const lost=os.filter(o=>o.status==='perdida'&&inP(o.lostAt));
 const ventas=sum(won,tcv);const cyc=won.filter(o=>o.createdAt&&o.wonAt).map(o=>Math.max(0,(parse(o.wonAt.slice(0,10))-parse(o.createdAt.slice(0,10)))/864e5));
 return{k,nuevas:nuevas.length,pipeNuevo:sum(nuevas,tcv),ganadas:won.length,perdidas:lost.length,ventas,montoPerdido:sum(lost,tcv),
  tasa:won.length+lost.length?won.length/(won.length+lost.length):null,ticket:won.length?ventas/won.length:null,ciclo:cyc.length?sum(cyc)/cyc.length:null,nuevasL:nuevas,won,lost}}
function oppSource(o){const l=S.leads.find(x=>x.oppId===o.id);return(l&&l.source)||byId(S.companies,o.companyId)?.source||'Sin fuente'}
function delta(a,b,t){
 if(a==null||b==null)return '';
 const same='<span class="var">sin cambio</span>';
 if(t==='pp'){const d=Math.round((a-b)*100);return d?`<span class="var ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d)} pp</span>`:same}
 if(t==='dias'){const d=Math.round(a-b);return d?`<span class="var ${d<0?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d)} días</span>`:same}
 const good=up=>(t==='inv'?!up:up)?'up':'down';
 if(!b)return a?`<span class="var ${good(true)}">▲ nuevo</span>`:'';
 const v=Math.round((a-b)/b*100);return v?`<span class="var ${good(v>0)}">${v>0?'▲':'▼'} ${Math.abs(v)}%</span>`:same}
function periodSection(os){
 const g=UI.repGran;const ks=perList(os,g);
 if(UI.repPer!=='todo'&&!ks.includes(UI.repPer))UI.repPer=ks[ks.length-1];
 const serie=ks.map(k=>perStats(os,k,g));
 const sel=UI.repPer==='todo'?perStats(os,'todo',g):serie.find(s=>s.k===UI.repPer);
 const i=serie.findIndex(s=>s.k===UI.repPer);const ant=i>0?serie[i-1]:null;
 const name=perLabel(UI.repPer,g);const antName=ant?perLabel(ant.k,g):'';
 const vs=(d,alt)=>ant&&d?`${d} <span class="muted">vs ${esc(antName)}</span>`:alt;
 const pct=t=>t==null?'—':Math.round(t*100)+'%';const dd=x=>x==null?'—':Math.round(x)+' días';
 const max=Math.max(1,...serie.map(s=>s.ventas));
 const src={};const add=(o,f)=>{const k=oppSource(o);src[k]=src[k]||{n:0,g:0,p:0,v:0};f(src[k])};
 sel.nuevasL.forEach(o=>add(o,x=>x.n++));sel.won.forEach(o=>add(o,x=>{x.g++;x.v+=tcv(o)}));sel.lost.forEach(o=>add(o,x=>x.p++));
 const srcRows=Object.entries(src).sort((a,b)=>b[1].v-a[1].v||b[1].n-a[1].n);
 return `<section class="panel" style="margin-bottom:16px">
  <div class="panel-h"><h2>Resultados por período</h2><div class="d-actions" style="margin:0"><div class="seg" role="group" aria-label="Período">${Object.entries(GRAN).map(([k,l])=>`<button class="${g===k?'on':''}" data-action="repGran" data-v="${k}">${l}</button>`).join('')}</div><button class="btn sm" data-action="exportPeriod">Descargar CSV</button></div></div>
  <p class="muted sm" style="margin:10px 14px 0">Ventas ganadas (TCV) por ${g==='mes'?'mes':g==='trimestre'?'trimestre':'año'}; sobre cada columna, el win rate. Toca una columna para ver su detalle.</p>
  <div class="cols">${serie.map(s=>`<button class="colb ${s.k===UI.repPer?'on':''}" data-action="repPer" data-v="${s.k}" title="${esc(perLabel(s.k,g))}: ${esc(mm(s.ventas))}, ${s.ganadas} ganadas y ${s.perdidas} perdidas"><span class="rate">${pct(s.tasa)}</span><span class="area"><span class="amt">${s.ventas?esc(mm(s.ventas)):''}</span><span class="bar" style="height:${s.ventas/max*100}%"></span></span><span class="per">${esc(perLabel(s.k,g))}</span></button>`).join('')}</div>
  <div class="chips" style="margin:0 14px 12px"><button class="chip ${UI.repPer==='todo'?'on':''}" data-action="repPer" data-v="todo">Ver todo el historial</button></div>
 </section>
 <h2 style="margin:0 0 10px">Detalle: ${esc(name)}</h2>
 <div class="kpis">
  <div class="kpi"><div class="l">Ventas ganadas</div><div class="v">${mm(sel.ventas)}</div><div class="h">${vs(delta(sel.ventas,ant&&ant.ventas),`${sel.ganadas} negocios`)}</div></div>
  <div class="kpi"><div class="l">Win rate</div><div class="v">${pct(sel.tasa)}</div><div class="h">${vs(delta(sel.tasa,ant&&ant.tasa,'pp'),`${sel.ganadas} ganadas, ${sel.perdidas} perdidas`)}</div></div>
  <div class="kpi"><div class="l">Ticket promedio</div><div class="v">${sel.ticket==null?'—':mm(sel.ticket)}</div><div class="h">${vs(delta(sel.ticket,ant&&ant.ticket),'por negocio ganado')}</div></div>
  <div class="kpi"><div class="l">Ciclo de venta</div><div class="v">${dd(sel.ciclo)}</div><div class="h">${vs(delta(sel.ciclo,ant&&ant.ciclo,'dias'),'creación a adjudicación')}</div></div>
  <div class="kpi"><div class="l">Oportunidades nuevas</div><div class="v">${sel.nuevas}</div><div class="h">${vs(delta(sel.nuevas,ant&&ant.nuevas),mm(sel.pipeNuevo)+' en pipeline')}</div></div>

// Metas por persona sumadas a la subgerencia y a la gerencia (Fase 1, punto 6). Cada rol ve las personas de su alcance

// por factura (neto emitido o pagado, por fecha de emisión) o por Booking (TCV adjudicado, por fecha de cierre).
function logroDe(ids,pref){
 if(metaFactura())return sum((S.invoices||[]).filter(x=>invCounts(x)&&(x.date||'').startsWith(pref)&&ids.has((byId(S.opps,x.oppId)||{}).ownerId)),x=>x.net||0);
 return sum(S.opps.filter(o=>o.status==='ganada'&&enFunnel(o)&&(o.wonAt||'').startsWith(pref)&&ids.has(o.ownerId)),tcv)}
function metasEquipo(){
 const t=S.config.targets||{},month=todayIso.slice(0,7),yr=month.slice(0,4),nm=Number(month.slice(5,7));
 const per=S.users.filter(u=>enAlcance(u.id)&&(seesAll()||u.id===S.currentUser)&&(metaDe(u.id)>0||['ejecutivo','subgerente'].includes(u.role)));
 const fila=(tipo,lab,ids,extra)=>{const mes=sum([...ids],metaDe);return{tipo,lab,ids:[...ids],mes,lm:logroDe(ids,month),ma:mes*nm,la:logroDe(ids,yr),...extra}};
 const eqs=[...new Set(per.map(u=>u.equipo||''))].sort((a,b)=>(a?0:1)-(b?0:1)||a.localeCompare(b));const out=[];
 for(const q of eqs){const ps=per.filter(u=>(u.equipo||'')===q).sort((a,b)=>(a.role==='subgerente'?0:1)-(b.role==='subgerente'?0:1)||a.name.localeCompare(b.name));
  ps.forEach(u=>out.push(fila('persona',u.name,new Set([u.id]),{sub:u.role==='subgerente'})));
  if(ps.length>1)out.push(fila('subgerencia',q?'Subgerencia '+q:'Sin subgerencia',new Set(ps.map(u=>u.id))))}
 if(eqs.length>1)out.push(fila('gerencia','Gerencia',new Set(per.map(u=>u.id))));
 return out}

 const contacts=S.contacts.filter(k=>k.companyId===a.companyId);
