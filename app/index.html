 const last=S.activities.filter(x=>x.companyId===a.companyId&&x.date<=todayIso).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,4);
 const q=[];
 if(!contacts.some(k=>k.decisionRole==='Decisor'))q.push('¿Quién toma la decisión final y quién más participa?');
 if(open.some(o=>!o.competitors))q.push('¿Con qué otros proveedores están conversando?');

 openDrawer(`<div class="d-head"><div><div class="muted sm">Briefing de reunión, ${esc(a.type.toLowerCase())} ${rel(a.date)}</div><h1>${esc(c?.tradeName||'')}</h1><p class="sub">${esc(a.desc)}</p></div><button class="btn ghost" data-action="closeDrawer" aria-label="Cerrar">✕</button></div>

 <div class="section"><h2>Oportunidades y ofertas abiertas</h2>${open.map(o=>`<div class="sm" style="padding:4px 0"><strong>${esc(o.name)}</strong>: ${esc(stageOf(o.stage).name)}, ${mm(tcv(o))}, ${o.prob}%. ${o.pain?'Dolor: '+esc(o.pain)+'.':''} ${o.competitors?'Competencia: '+esc(o.competitors)+'.':''}</div>`).join('')||emptyMsg('Sin oportunidades abiertas.')}${offers.map(f=>`<div class="sm" style="padding:4px 0">Oferta ${esc(f.code)} V${f.versions.length}: ${esc(f.status)}, ${mm(offerNet(f))}.</div>`).join('')}</div>

function outlookUrl(a){
 const start=new Date(`${a.date}T${a.time||'09:00'}:00`);const end=new Date(start.getTime()+(Number(a.duration)||60)*60000);
 const z=d=>d.toISOString().replace(/\.\d{3}Z$/,'Z');
 const q={path:'/calendar/action/compose',rru:'addevent',subject:a.subject||a.desc||'Reunión',startdt:z(start),enddt:z(end)};
 if(a.place)q.location=a.place;if(a.attendees&&a.attendees.length)q.to=a.attendees.join(',');if(a.body)q.body=a.body;
 return OUTLOOK_COMPOSE+'?'+Object.entries(q).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
}

   Cada oportunidad importada guarda en o.fx los últimos valores que vinieron del funnel.

function fxNum(v){if(typeof v==='number')return v;let s=String(v??'').replace(/[$\s%]/g,'');if(!s)return 0;
 if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
 else if(s.includes(','))s=/^-?[1-9]\d{0,2}(,\d{3})+$/.test(s)?s.replace(/,/g,''):s.replace(',','.');
 else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return Number(s)||0}
function fxDate(v){if(v===''||v==null)return '';
 if(typeof v==='number'){if(v<1000)return '';const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10)}
 const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
 m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return ''}
function fxProb(v,dec){const n=fxNum(v),p=typeof v==='string'&&v.includes('%')?n:n<=1?n*100:n,f=dec?10:1;return Math.round(p*f)/f}
function fxTitle(t){t=String(t||'').trim();let code='',rest=t;const m=t.match(/^((?:CM|OP)-\d{6}-\d{2})-?\s*(.*)$/);if(m){code=m[1];rest=m[2]}
 let comp,desc;const m2=rest.match(/^(.*?)\s*-?\s*\((.*)\)\s*(?:-\s*([A-Za-z0-9]{1,4}))?\s*$/);
 if(m2){comp=m2[1];desc=m2[2]+(m2[3]?' - '+m2[3]:'')}else{const m3=rest.match(/^(ENEL)[\s-]+(.*?)(-O(-COSTOS)?)?$/);if(m3){comp=m3[1];desc=m3[2]}else{comp=rest;desc=rest}}
 comp=comp.replace(/[\s-]+$/,'').trim().toUpperCase();return{code,comp:FX_ALIAS[comp]||comp,desc:desc.trim()}}
function fxRows(table){
 const hi=table.findIndex(r=>r&&r.some(c=>fxNorm(c)==='estado')&&r.some(c=>fxNorm(c)==='titulo'));
 if(hi<0)throw new Error('No encontré las columnas «Estado» y «Título». ¿Es la exportación del Funnel de Ventas?');

 const oi=(()=>{const n=FX_OWNER_COLS.find(n=>ix(n)>=0);return n?ix(n):table[hi].length>10?10:-1})();fxRows.ownerCol=oi<0?'':(String(table[hi][oi]??'').trim()||'columna K')+(FX_OWNER_COLS.includes(H[oi])?'':' (columna K)');
 return table.slice(hi+1).filter(r=>r&&String(g(r,'titulo')).trim()).map(r=>{const t=fxTitle(g(r,'titulo'));
  return{id:String(g(r,'id')??'').replace(/\D/g,''),title:String(g(r,'titulo')).trim(),...t,estado:String(g(r,'estado')).trim(),tipo:String(g(r,'tipo de negocio')).trim(),
   F:fxNum(g(r,'monto seg. fisica')),E:fxNum(g(r,'monto seg. electronica')),Hb:fxNum(g(r,'cargo habilitacion')),prob:fxProb(g(r,'probabilidad')),
   mg:g(r,'mg %')===''?'':fxProb(g(r,'mg %'),1),cost:fxNum(g(r,'costo del proyecto')),proj:fxNum(g(r,'proyeccion')),fact:String(g(r,'primera facturacion')).trim(),
   created:fxDate(g(r,'fecha de contacto'))||todayIso,pres:fxDate(g(r,'fecha presentacion')),adj:fxDate(g(r,'fecha de adjudicacion')),ult:fxDate(g(r,'fecha ultima conversacion')),
   ej:oi<0?'':String(r[oi]??'').trim(),td:String(g(r,'tomador de decision')).trim(),uf:String(g(r,'usuario final')).trim(),notes:String(g(r,'notas')).trim(),

function fxTarget(r){

 const t={estado:r.estado,oneTime:Math.round(one),monthly:Math.round(mon),prob:r.prob,name:r.desc};
 if(r.estado==='Booking')Object.assign(t,{status:'ganada',stage:'adjudicada',prob:100,date:r.adj||last});

function fxEnsure(){S.opps.forEach(o=>{if(o.fx)return;const a=S.activities.find(x=>x.entityId===o.id&&x.type==='Nota'&&/^Funnel: /.test(x.desc||''));if(!a)return;

function fxBuildPlan(rows){
 fxEnsure();
 const linked=S.opps.filter(o=>o.fx),used=new Set(),plan={news:[],changes:[],same:0,missing:[],rows:rows.length,hasId:rows.some(r=>r.id)};
 const find=r=>{const free=linked.filter(o=>!used.has(o.id));
  const byCode=r.code&&S.opps.find(o=>!used.has(o.id)&&String(o.code||'').toUpperCase()===r.code.toUpperCase()&&(!o.fx||!o.fx.id||!r.id||o.fx.id===r.id));
  return(r.id&&free.find(o=>o.fx.id===r.id))||byCode||free.find(o=>(!o.fx.id||!r.id)&&fxNorm(o.fx.title)===fxNorm(r.title)&&o.fx.created===r.created)||free.find(o=>(!o.fx.id||!r.id)&&fxNorm(o.fx.title)===fxNorm(r.title))};
 // (si el archivo no trae ID, como el Excel semanal actual, también se reconocen por título las que se importaron antes con ID)

  if(!o){plan.news.push(r);continue}
  used.add(o.id);const s=o.fx||{},t=fxTarget(r),ch=[];
  if(!o.fx)ch.push(['Vínculo','Creada en el CRM','Vinculada al funnel por el código '+o.code]);
  const was=(k,cur)=>s[k]!==undefined?s[k]:cur;
  if(t.estado!==was('estado',''))ch.push(['Estado',was('estado','—'),t.estado]);
  if(t.status==='abierta'&&t.prob!==was('prob',o.prob))ch.push(['Probabilidad',was('prob',o.prob)+'%',t.prob+'%']);
  if(t.oneTime!==was('oneTime',o.oneTime))ch.push(['Valor único',clp(was('oneTime',o.oneTime)),clp(t.oneTime)]);
  if(t.monthly!==was('monthly',o.monthly))ch.push(['Mensual',clp(was('monthly',o.monthly)),clp(t.monthly)]);
  if(fxNorm(r.desc)!==fxNorm(o.name))ch.push(['Nombre',o.name,r.desc]);
  if(r.notes&&r.notes!==was('notes',''))ch.push(['Notas','',r.notes]);
  for(const[k,l]of[['pres','Fecha presentación'],['adj','Fecha adjudicación'],['ult','Última conversación']])if(r[k]&&s[k]!==undefined&&r[k]!==s[k])ch.push([l,s[k]?fmtDate(s[k]):'—',fmtDate(r[k])]);
  if(s.mg!==undefined&&r.mg!==s.mg)ch.push(['Margen',s.mg===''?'—':s.mg+'%',r.mg===''?'—':r.mg+'%']);
  if(s.cost!==undefined&&r.cost!==s.cost)ch.push(['Costo',clp(s.cost),clp(r.cost)]);
  if(t.status==='abierta'&&o.status==='abierta'&&t.estado===was('estado','')&&FX_STAGE[t.estado]&&o.stage!==t.stage)ch.push(['Etapa',stageOf(o.stage)?.name||o.stage,stageOf(t.stage)?.name]);

 else if(t.status==='perdida'){let[reason,com]=FX_LOST[r.estado];if(r.motivo){const m=LOSS_REASONS.find(x=>fxNorm(x)===fxNorm(r.motivo));if(m)reason=m;com=`${r.estado} en el funnel. Motivo: ${r.motivo}.`}Object.assign(o,{status:'perdida',prob:0,lostAt:t.date,closeDate:t.date,lossReason:reason,lossComment:com})}
 else{if(o.status!=='abierta'){o.status='abierta';delete o.wonAt;delete o.lostAt;if(o.stage==='adjudicada')o.stage=t.stage}
  if(FX_STAGE[r.estado]){if(t.stage!==o.stage)setStage(o,t.stage)}else{const si=id=>STAGES.findIndex(s=>s.id===id);if(si(t.stage)>si(o.stage))setStage(o,t.stage)}o.prob=t.prob;o.probReason=`Probabilidad del funnel (${r.estado}).`;if(!o.closeDate||o.closeDate<todayIso)o.closeDate=fxCloseDate(r)}}
function fxApply(){
 const plan=FX_PLAN;if(!plan)return;FX_PLAN=null;let n=0;
 for(const r of plan.news){const c=fxCompany(r),t=fxTarget(r),ids=[fxContact(c,r.td,'Decisor'),fxContact(c,r.uf,'Usuario')].filter((x,i,a)=>x&&a.indexOf(x)===i);
  S.seq.opp=(S.seq.opp||0)+1;
  const o={id:uid('o'),code:r.code||'OP-'+todayIso.slice(0,4)+'-'+String(S.seq.opp).padStart(4,'0'),name:r.desc,companyId:c.id,siteId:'',ownerId:S.currentUser,stage:t.stage,prob:t.prob,currency:'CLP',oneTime:t.oneTime,monthly:t.monthly,term:t.monthly?12:0,
   closeDate:fxCloseDate(r),nextAction:'',nextActionDate:'',stageEnteredAt:todayIso,createdAt:r.created,status:'abierta',contactIds:ids,need:'',pain:'',competitors:'',currentProvider:'',strategy:'',risks:'',probReason:`Probabilidad del funnel (${r.estado}).`,history:[],
   services:[...new Set(FX_SVC.filter(([re])=>re.test(r.desc.toUpperCase())).map(x=>x[1]))]};
  if(t.status!=='abierta'){o.stage=t.stage;fxApplyStatus(o,t,r)}
  if(o.status==='ganada')c.relation='Cliente';
  o.fx=fxSnap(r);S.opps.push(o);
  const lp=S.leads.find(l=>l.cmCode&&!l.oppId&&l.cmCode.toUpperCase()===String(o.code).toUpperCase());
  if(lp){o.leadId=lp.id;lp.oppId=o.id;if(o.companyId!==lp.companyId)audit(o.code,'Cliente','Prospecto en '+cname(lp.companyId),'Excel en '+cname(o.companyId));audit(o.code,'Vínculo','',lp.code+' (código reservado al convertir)')}
  S.activities.unshift({id:uid('a'),sys:true,date:r.created,userId:S.currentUser,type:'Nota',entityType:'opp',entityId:o.id,companyId:c.id,desc:fxDetail(r),result:r.notes,nextAction:'',nextActionDate:''});
  audit(o.code,'Oportunidad','','Importada del funnel');n++}
 for(const{o,r,ch}of plan.changes){const t=fxTarget(r),s=o.fx||{},was=(k,cur)=>s[k]!==undefined?s[k]:cur;
  if(t.estado!==was('estado',''))fxApplyStatus(o,t,r);
  else if(t.status==='abierta'&&o.status==='abierta'&&FX_STAGE[t.estado]&&o.stage!==t.stage)setStage(o,t.stage);
  else if(t.status==='abierta'&&o.status==='abierta'&&t.prob!==was('prob',o.prob)){o.prob=t.prob;o.probReason=`Probabilidad del funnel (${r.estado}).`}
  if(t.oneTime!==was('oneTime',o.oneTime))o.oneTime=t.oneTime;
  if(t.monthly!==was('monthly',o.monthly)){o.monthly=t.monthly;if(o.monthly&&!o.term)o.term=12}
  if(fxNorm(r.desc)!==fxNorm(o.name))o.name=r.desc;
  const c=byId(S.companies,o.companyId);if(c){[fxContact(c,r.td,'Decisor'),fxContact(c,r.uf,'Usuario')].forEach(id=>{if(id&&!o.contactIds.includes(id))o.contactIds.push(id)});if(o.status==='ganada')c.relation='Cliente'}
  if(ch.length){ch.forEach(([f,a,b])=>audit(o.code,f+' (funnel)',a,b));
   S.activities.unshift({id:uid('a'),sys:true,date:todayIso,userId:S.currentUser,type:'Nota',entityType:'opp',entityId:o.id,companyId:o.companyId,desc:'Actualización del funnel: '+ch.filter(x=>x[0]!=='Notas').map(([f,a,b])=>`${f}: ${a} → ${b}`).join(' · '),result:r.notes&&r.notes!==was('notes','')?r.notes:'',nextAction:'',nextActionDate:''});n++}
  o.fx=fxSnap(r)}
 const aus=fxMarkMissing(plan.missing);
 S.fxLast={at:todayIso,rows:plan.rows};save();closeModal();render();
 toast(`Funnel importado: ${plan.news.length} nuevas, ${plan.changes.filter(x=>!x.quiet).length} actualizadas${aus?`, ${aus} marcadas por no venir en el archivo (no se borró nada)`:''}.`)}
// Las oportunidades que vinieron de un funnel anterior y no están en este archivo NO se borran: quedan marcadas
// con la fecha en que dejaron de venir (o.fx.ausente), con su historial, tareas y ofertas intactos, y generan una
// alerta para revisarlas. Si vuelven a venir en una importación posterior, la marca se quita sola (fxSnap reemplaza o.fx).
// Las que ya estaban marcadas conservan la fecha original. Las oportunidades creadas a mano (sin vínculo al funnel) no se tocan.
function fxMarkMissing(list){
 let n=0;
 for(const o of list){if(o.fx.ausente)continue;o.fx.ausente=todayIso;n++;
  audit(o.code,'Presencia (funnel)','En el funnel','No vino en la importación del '+fmtDate(todayIso));}
 return n}
const fxAusente=o=>!!(o.fx&&o.fx.ausente);

function fxPreview(plan){
 const real=plan.changes.filter(x=>!x.quiet);
 const row=(c,name,info)=>`<tr><td>${esc(c)}</td><td>${esc(name)}</td><td>${info}</td></tr>`;
 const tbl=(head,body)=>`<div class="tbl-wrap" style="max-height:260px;overflow:auto"><table class="tbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
 openModal(`<h1 style="font-size:20px">Importar funnel</h1>
 <p class="sub sm">${plan.total} filas leídas; ${plan.rows} son de ${esc(FX_OWNER)} y ${plan.others} de otros ejecutivos (se omiten, columna «${esc(plan.ownerCol)}»). ${plan.news.length} nuevas, ${real.length} con cambios, ${plan.same} sin cambios.</p>
 ${(()=>{const sin=plan.news.filter(r=>!r.code).length+plan.changes.filter(x=>!x.r.code).length+0;return sin?`<div class="warnbox" style="margin-top:10px">${sin} fila${sin>1?'s':''} sin código CM en el título: se reconocen por el título completo. Si ese título cambia en el Excel, aparecerá como nueva.</div>`:''})()}
 ${plan.news.length?`<h3>Nuevas</h3>${tbl(['Empresa','Oportunidad','Estado y monto'],plan.news.map(r=>{const t=fxTarget(r);const lp=r.code&&S.leads.find(l=>l.cmCode&&!l.oppId&&l.cmCode.toUpperCase()===r.code.toUpperCase());return row(r.comp,(r.code?r.code+' · ':'')+r.desc,esc(r.estado)+' · '+mm(r.proj>0?r.proj:t.oneTime+t.monthly*12)+(lp?' · <b>se vincula a '+esc(lp.code)+'</b>':''))}).join(''))}`:''}
 ${real.length?`<h3>Con cambios</h3>${tbl(['Empresa','Oportunidad','Cambios'],real.map(({o,ch})=>row(cname(o.companyId),o.name,ch.map(([f,a,b])=>f==='Notas'?`<b>Notas</b>: ${esc(b)}`:`<b>${esc(f)}</b>: ${esc(a)} → ${esc(b)}`).join('<br>'))).join(''))}`:''}
 ${plan.missing.length?(()=>{const nue=plan.missing.filter(o=>!o.fx.ausente),sig=plan.missing.filter(o=>o.fx.ausente);
  return `<h3>No vienen en este archivo (no se borran)</h3><div class="warnbox info" style="margin:6px 0">${nue.length?`${nue.length} oportunidad${nue.length>1?'es':''} de un funnel anterior no aparece${nue.length>1?'n':''} en este archivo. Al aplicar quedan marcadas y te aparece una alerta para revisarlas; su historial, tareas y ofertas se mantienen. Si vuelven a venir en otra importación, la marca se quita sola.`:''}${nue.length&&sig.length?' ':''}${sig.length?`${sig.length} ya estaba${sig.length>1?'n':''} marcada${sig.length>1?'s':''} de antes y sigue${sig.length>1?'n':''} sin venir.`:''}</div>${tbl(['Empresa','Oportunidad','Situación'],nue.map(o=>row(cname(o.companyId),o.name,'Se marca ahora · '+esc(o.fx.estado||o.status))).concat(sig.map(o=>row(cname(o.companyId),o.name,'Sin venir desde el '+esc(fmtDate(o.fx.ausente))))).join(''))}`})():''}
 ${!plan.news.length&&!real.length&&!plan.missing.some(o=>!o.fx.ausente)?`<p style="margin-top:12px">Todo está al día: el CRM ya tiene la información de este archivo.${plan.changes.length?` Al aplicar se completan las fechas del funnel (presentación, adjudicación, última conversación) de ${plan.changes.length} oportunidades.`:''}</p>`:''}
 <p class="sm muted" style="margin-top:10px">En las oportunidades que siguen en el funnel solo se actualizan estado, probabilidad y montos (el nombre solo si no lo editaste en el CRM); tus contactos, actividades, tareas y próximas acciones se mantienen. Las oportunidades que creaste a mano en el CRM no se tocan.</p>
 <div class="form-foot"><button class="btn" data-action="closeModal">Cancelar</button>${plan.news.length||plan.changes.length||plan.missing.some(o=>!o.fx.ausente)?'<button class="btn pri" data-action="fxApply">Aplicar</button>':''}</div>`);
 const m=$('#modalLayer .modal');if(m)m.classList.add('wide')}
let META_PEND=null;
async function metaImportFile(file){
 try{const rows=await fxReadXlsx(await file.arrayBuffer(),/meta/i);const m=parseMetaPresupuesto(rows);m.fuente=file.name;metaPreview(m)}
 catch(e){toast('No se pudo leer la meta: '+esc(e.message))}}
function metaPreview(m){META_PEND=m;const tot=sum(Object.values(m.venta),a=>sum(a));const ya=metaPres(m.yr);
 openModal(`<h1 style="font-size:20px">Meta de facturación ${esc(m.yr)}</h1><p class="sub sm">Desde ${esc(m.fuente||'el Excel')}. Revisa antes de usarla.${ya?` <strong>Reemplaza la meta ${esc(m.yr)} cargada (${mm(metaYear(m.yr))}).</strong>`:''}</p>

 ${META_LINEAS.filter(([k])=>m.venta[k]).map(([k])=>`<tr><td>${esc(k)}</td>${m.venta[k].map(v=>`<td class="num">${v?mm(v):'—'}</td>`).join('')}<td class="num"><strong>${mm(sum(m.venta[k]))}</strong></td></tr>`).join('')}
 <tr><td><strong>Total</strong></td>${MESES.map((_,i)=>`<td class="num"><strong>${mm(sum(Object.values(m.venta),a=>a[i]||0))}</strong></td>`).join('')}<td class="num"><strong>${mm(tot)}</strong></td></tr></tbody></table></div>
 <p class="sm" style="margin-top:8px">Meta de margen ${Object.keys(m.margen||{}).length?mm(sum(Object.values(m.margen),a=>sum(a))):'no viene en el archivo'}.</p>
 <div class="form-foot"><button class="btn" data-action="closeModal">Cancelar</button><button class="btn pri" data-action="metaUsar">Usar esta meta</button></div>`)}
async function fxImportFile(file){
 try{
  if(S.mode!=='real')return toast('Primero restaura tu respaldo o usa «Empezar con mis datos». El funnel no se importa sobre los datos de ejemplo.');
  const table=/\.csv$/i.test(file.name)?fxReadCsv(await file.text()):await fxReadXlsx(await file.arrayBuffer());
  const all=fxRows(table);if(!all.length)return toast('El archivo no tiene filas con datos.');
  const col=fxRows.ownerCol;
  if(!col)return toast(`No encontré la columna del ejecutivo en el archivo. Agrega la columna «Generador» a la vista de SharePoint antes de exportar; así importo solo las oportunidades de ${esc(FX_OWNER)}.`);
  const rows=all.filter(r=>fxIsOwner(r.ej));
  if(!rows.length)return toast(`El archivo no trae oportunidades de ${esc(FX_OWNER)} en la columna «${esc(col)}».`);
  FX_PLAN=fxBuildPlan(rows);FX_PLAN.total=all.length;FX_PLAN.others=all.length-rows.length;FX_PLAN.ownerCol=col;fxPreview(FX_PLAN);
 }catch(e){toast(esc(e.message||'No se pudo leer el archivo.'))}}

 // CRM FS: las oportunidades se crean solo en el CRM. La importación del funnel desde Excel (fxImportFile) quedó sin entrada en la pantalla.

 if(t.hasAttribute('data-restore')&&t.files&&t.files[0]){const rd=new FileReader();rd.onload=()=>{try{const data=JSON.parse(rd.result);if(!Array.isArray(data.companies)||!Array.isArray(data.opps))throw new Error('formato');S=data;migrate();marcarReemplazo();save();closeDrawer();render();toast('Respaldo restaurado.')}catch(e){toast('El archivo no es un respaldo válido del CRM.')}};rd.readAsText(t.files[0]);return}
 if((t.id==='userSel'||t.dataset.actionChange==='user')&&STORE.mode==='servidor'&&SES.yo)return;   // con sesión, la persona la fija el servidor
 if(t.id==='userSel'||t.dataset.actionChange==='user'){S.currentUser=t.value;save();closeDrawer();closeNav();render();toast(`Viendo como ${esc(me().name)} (${esc(me().roleLabel)}).`);return}
 if(t.hasAttribute('data-score')){const f=t.form;const l=byId(S.leads,f.dataset.id);const tmp={...l,vars:{}};SCORE_VARS.forEach(v=>{if(!v.auto){const s=f.querySelector(`[name=v_${v.k}]`);if(s&&s.value!=='')tmp.vars[v.k]=s.value}});$('#scoreBox').innerHTML=scoreBox(tmp);return}
 if(t.name==='stage'&&t.form&&t.form.dataset.form==='opp'){const st=stageOf(t.value);const p=t.form.querySelector('[name=prob]');p.value=st.p;t.form.querySelector('[name=probReason]').value='';$('#probHint').textContent=`Por defecto para la etapa: ${st.p}%`;return}
 if(t.name==='dst'&&t.form&&t.form.dataset.form==='mergeK'){const el=t.form.querySelector('[data-merge-info]');if(el)el.innerHTML=mergeKInfo(t.form.dataset.id,t.value);return}
 if(t.name==='companyId'&&t.form&&t.form.dataset.form==='newLead'){const s=t.form.querySelector('[name=contactId]');s.innerHTML=leadContactOpts(t.value,'');const ss=t.form.querySelector('[name=siteId]');if(ss)ss.innerHTML=leadSiteOpts(t.value,'');return}
 if(t.name==='contactId'&&t.form&&t.form.dataset.form==='newLead'){const k=byId(S.contacts,t.value);const ss=t.form.querySelector('[name=siteId]');if(k&&k.siteId&&ss)ss.value=k.siteId;return}
 if(t.name==='companyId'&&t.form&&t.form.dataset.form==='contact'){const ss=t.form.querySelector('[name=siteId]');if(ss)ss.innerHTML=contactSiteOpts(t.value,'');return}

});
